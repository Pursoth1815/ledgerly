<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Account details</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-variant-numeric: tabular-nums; background: {{c.scrim}}; color: {{c.t1}}">
<section aria-label="{{title}}" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 10px 20px 28px; border-radius: 28px 28px 0 0; background: {{c.s1}}; display: flex; flex-direction: column; gap: 16px">
<span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: {{c.line}}"></span>
<header style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 22px; font-weight: 800">{{title}}</h1>
<p style="margin: 0; font-size: 13px; font-weight: 500; color: {{c.t2}}">{{linked}}</p>
</header>
<div style="display: flex; flex-direction: column; border-radius: 22px; border: 1px solid {{c.line}}; overflow: hidden">
<label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 0 16px; border-bottom: 1px solid {{c.line}}">
<span style="font-size: 14px; color: {{c.t2}}">Nickname</span>
<input value="{{nick}}" onChange="{{setNick}}" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: {{c.t1}}; font-family: inherit; font-size: 16px; font-weight: 700; text-align: right">
</label>
<a href="AddAccount.dc.html" aria-label="Bank, {{bank}}. Change bank" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 0 16px; border-bottom: 1px solid {{c.line}}; color: {{c.t1}}; text-decoration: none">
<span style="font-size: 14px; color: {{c.t2}}">Bank</span>
<span style="display: flex; align-items: center; gap: 4px; min-width: 0">
<span style="font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{bank}}</span>
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.t3}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M6 9l6 6 6-6"></path></svg>
</span>
</a>
<label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 0 16px; border-bottom: 1px solid {{c.line}}">
<span style="font-size: 14px; color: {{c.t2}}">Last four digits</span>
<input value="{{last4}}" onChange="{{setLast4}}" inputmode="numeric" maxlength="4" placeholder="0000" aria-label="Last four digits" style="width: 96px; border: 0; outline: none; background: transparent; color: {{c.t1}}; caret-color: {{accent}}; font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 600; letter-spacing: 3px; text-align: right">
</label>
<sc-if value="{{isCard}}" hint-placeholder-val="{{ false }}">
<a href="BillDueDay.dc.html" aria-label="Bill due date, 5th of every month" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 0 16px; border-bottom: 1px solid {{c.line}}; color: {{c.t1}}; text-decoration: none">
<span style="font-size: 14px; color: {{c.t2}}">Bill due date</span>
<span style="font-size: 15px; font-weight: 700">5th of every month ›</span>
</a>
</sc-if>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 0 16px">
<span style="font-size: 14px; color: {{c.t2}}">{{defaultLabel}}</span>
<button onClick="{{toggle}}" role="switch" aria-checked="{{defChecked}}" aria-label="{{defaultLabel}}" style="width: 52px; height: 32px; flex-shrink: 0; border-radius: 16px; border: 0; padding: 3px; background: {{switchBg}}; display: flex; justify-content: {{switchAlign}}">
<span style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF"></span>
</button>
</div>
</div>
<sc-if value="{{taken}}" hint-placeholder-val="{{ false }}">
<div role="alert" style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 16px; border: 1px solid {{c.red}}; background: {{c.redSoft}}; color: {{c.t1}}; font-size: 13px; font-weight: 600; line-height: 1.4">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{c.red}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16.5v.01"></path></svg>
<span>{{taken}}</span>
</div>
</sc-if>
<button style="height: 52px; border-radius: 26px; border: 1.5px solid {{c.red}}; background: transparent; color: {{c.red}}; font-family: inherit; font-size: 15px; font-weight: 800">{{removeLabel}}</button>
<button style="height: 56px; border-radius: 28px; border: 0; background: {{c.money}}; color: {{c.onAccent}}; font-family: inherit; font-size: 17px; font-weight: 800">Save changes</button>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"mode":{"editor":"enum","options":["bank","card"],"default":"bank"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const card = props && props.mode === 'card';
    this.state = { nick: card ? 'Kiwi' : 'Primary', last4: card ? '4417' : '2210', def: true };
  }
  pal(t) {
    if (t === 'light') return {s1:'#FFFFFF',line:'#DDE1E9',t1:'#11141B',t2:'#434A58',money:'#047857',card:'#6D28D9',red:'#B91C1C',redSoft:'#FEF2F2',t3:'#6B7280',off:'#C3C8D2',onAccent:'#FFFFFF',scrim:'#9CA3AF'};
    return {s1:'#161922',line:'#2B3040',t1:'#F3F5F9',t2:'#B6BCC9',money:'#34D399',card:'#C4A5FF',red:'#FF7B7B',redSoft:'#2A1518',t3:'#8A91A0',off:'#3A4050',onAccent:'#0D0F14',scrim:'#05060A'};
  }
  renderVals() {
    const c = this.pal(this.props.theme);
    const s = this.state || {};
    const isCard = this.props.mode === 'card';
    const code = isCard ? 'YESBNK' : 'FEDBNK';
    const digits = s.last4 == null ? '' : s.last4;
    // Made-up accounts of the same kind, to show the blocked-digits error.
    const others = isCard ? { '7781': 'Amazon Pay', '2290': 'Swiggy' } : { '8124': 'Savings' };
    const takenBy = digits.length === 4 ? others[digits] : null;
    return {
      c,
      isCard,
      title: isCard ? 'Card details' : 'Account details',
      accent: isCard ? c.card : c.money,
      linked: digits.length === 4 ? 'SMS from ' + code + ' ending ' + digits + ' are linked here.' : 'Enter the last four digits to link SMS from ' + code + '.',
      taken: takenBy ? takenBy + ' already ends ••' + digits + '. Each ' + (isCard ? 'card' : 'bank account') + ' needs its own last four digits.' : null,
      nick: s.nick,
      setNick: (e) => this.setState({ nick: e.target.value }),
      bank: isCard ? 'YES BANK' : 'Federal Bank',
      last4: digits,
      setLast4: (e) => this.setState({ last4: e.target.value.replace(/\D/g, '').slice(0, 4) }),
      defaultLabel: isCard ? 'Default credit card' : 'Default for UPI',
      defChecked: s.def ? 'true' : 'false',
      toggle: () => this.setState({ def: !s.def }),
      switchBg: s.def ? (isCard ? c.card : c.money) : c.off,
      switchAlign: s.def ? 'flex-end' : 'flex-start',
      removeLabel: isCard ? 'Remove card' : 'Remove account'
    };
  }
}
</script>
</body>
</html>
