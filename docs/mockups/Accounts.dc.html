<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Accounts and cards</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 1120px; position: relative; box-sizing: border-box; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-variant-numeric: tabular-nums; background: {{c.bg}}; color: {{c.t1}}">
<main style="padding: 20px 20px 40px; display: flex; flex-direction: column; gap: 22px">

<header style="display: flex; flex-direction: column; gap: 14px">
<a href="Main.dc.html" aria-label="Back to Money" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; background: {{c.s2}}; color: {{c.t1}}">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
</a>
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.5px">Accounts and cards</h1>
<p style="margin: 0; font-size: 14px; color: {{c.t2}}">The last four digits link each SMS to the right one.</p>
</div>
</header>

<section aria-label="Bank accounts" style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<h2 style="margin: 0; font-size: 13px; font-weight: 700; color: {{c.t3}}">Bank accounts · used for UPI</h2>
<span style="font-size: 13px; font-weight: 700; color: {{c.money}}">₹11,200 in Nov</span>
</div>
<div style="display: flex; flex-direction: column; background: {{c.s1}}; border: 1px solid {{c.line}}; border-radius: 22px; overflow: hidden">
<sc-for list="{{banks}}" as="b" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 10px 16px; border-bottom: {{b.divider}}">
<span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: {{b.color}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800">{{b.initials}}</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700">{{b.nick}}<sc-if value="{{b.isDefault}}" hint-placeholder-val="{{ false }}"><span style="padding: 2px 8px; border-radius: 999px; background: {{c.moneyT}}; color: {{c.money}}; font-size: 11px; font-weight: 700">Default</span></sc-if></span>
<span style="font-size: 12px; color: {{c.t3}}">{{b.bank}} ••{{b.last4}}</span>
</span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
<span style="font-size: 15px; font-weight: 800">{{b.spent}}</span>
<span style="font-size: 11px; color: {{c.t3}}">this month</span>
</span>
</div>
</sc-for>
</div>
<button style="height: 48px; border-radius: 24px; border: 1.5px dashed {{c.money}}; background: transparent; color: {{c.money}}; font-family: inherit; font-size: 14px; font-weight: 700">+ Add bank account</button>
</section>

<section aria-label="Credit cards" style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<h2 style="margin: 0; font-size: 13px; font-weight: 700; color: {{c.t3}}">Credit cards</h2>
<span style="font-size: 13px; font-weight: 700; color: {{c.card}}">₹7,220 in Nov</span>
</div>
<sc-for list="{{cards}}" as="k" hint-placeholder-count="3">
<article aria-label="{{k.nick}}" style="height: 128px; box-sizing: border-box; border-radius: 22px; padding: 16px 18px; background: {{k.color}}; color: #FFFFFF; display: flex; flex-direction: column; justify-content: space-between">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 13px; font-weight: 700">{{k.bank}}</span>
<sc-if value="{{k.isDefault}}" hint-placeholder-val="{{ false }}"><span style="padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,0.2); font-size: 11px; font-weight: 700">Default</span></sc-if>
</div>
<span style="font-size: 19px; font-weight: 800">{{k.nick}}</span>
<div style="display: flex; align-items: baseline; justify-content: space-between">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; letter-spacing: 1px">•••• {{k.last4}}</span>
<span style="font-size: 14px; font-weight: 800">{{k.spent}} <span style="font-size: 11px; font-weight: 600">this month</span></span>
</div>
</article>
</sc-for>
<button style="height: 48px; border-radius: 24px; border: 1.5px dashed {{c.card}}; background: transparent; color: {{c.card}}; font-family: inherit; font-size: 14px; font-weight: 700">+ Add credit card</button>
</section>

<button style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 16px; border-radius: 18px; border: 0; background: {{c.s1}}; color: {{c.t2}}; font-family: inherit; font-size: 14px; font-weight: 600">Archived · 1 account, history kept<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></button>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":1120}}'>
class Component extends DCLogic {
  pal(t) {
    if (t === 'light') return {bg:'#F3F4F8',s1:'#FFFFFF',s2:'#ECEEF3',line:'#DDE1E9',t1:'#11141B',t2:'#434A58',t3:'#5D6474',btn:'#11141B',btnT:'#FFFFFF',money:'#047857',moneyT:'#E1F4EA',card:'#6D28D9',cardT:'#EFE7FD',lend:'#A14A06',lendT:'#FDF0D8',travel:'#4338CA',travelT:'#E8E9FD',notes:'#735E3B',notesT:'#F3ECE0',vault:'#44536A',vaultT:'#E6EBF2',well:'#0F766E',wellT:'#DBF3EF',review:'#B03A0A',reviewT:'#FDEADB',red:'#B91C1C',redT:'#FBE3E3',food:'#E8590C',onAccent:'#FFFFFF',scrim:'rgba(17,20,27,0.45)'};
    return {bg:'#0D0F14',s1:'#161922',s2:'#1F2330',line:'#2B3040',t1:'#F3F5F9',t2:'#B6BCC9',t3:'#8F96A6',btn:'#F3F5F9',btnT:'#0D0F14',money:'#34D399',moneyT:'rgba(52,211,153,0.14)',card:'#C4A5FF',cardT:'rgba(196,165,255,0.15)',lend:'#FBBF24',lendT:'rgba(251,191,36,0.13)',travel:'#8F98FF',travelT:'rgba(143,152,255,0.16)',notes:'#E6CDA3',notesT:'rgba(230,205,163,0.13)',vault:'#A3B5CC',vaultT:'rgba(163,181,204,0.14)',well:'#2DD4BF',wellT:'rgba(45,212,191,0.14)',review:'#FF9F5A',reviewT:'rgba(255,159,90,0.15)',red:'#FF7B7B',redT:'rgba(255,123,123,0.14)',food:'#FF8A4C',onAccent:'#0D0F14',scrim:'rgba(0,0,0,0.6)'};
  }
  renderVals() {
    const c = this.pal(this.props.theme);
    const banks = [
      { nick: 'Salary account', bank: 'HDFC Bank', last4: '4821', initials: 'HD', color: '#1E3A8A', isDefault: true, spent: '₹8,450' },
      { nick: 'Savings', bank: 'State Bank of India', last4: '1093', initials: 'SB', color: '#155E75', isDefault: false, spent: '₹2,750' },
      { nick: 'Joint account', bank: 'ICICI Bank', last4: '7710', initials: 'IC', color: '#9A3412', isDefault: false, spent: '₹0' }
    ].map((b, i, all) => ({ ...b, divider: i < all.length - 1 ? '1px solid ' + c.line : '0' }));
    const cards = [
      { nick: 'Travel card', bank: 'HDFC Bank', last4: '3344', color: '#1E3A8A', isDefault: true, spent: '₹5,120' },
      { nick: 'Amazon Pay card', bank: 'ICICI Bank', last4: '9021', color: '#9A3412', isDefault: false, spent: '₹2,100' },
      { nick: 'SimplyCLICK', bank: 'SBI Card', last4: '5567', color: '#155E75', isDefault: false, spent: '₹0' }
    ];
    return { c, banks, cards };
  }
}
</script>
</body>
</html>
