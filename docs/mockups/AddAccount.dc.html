<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add bank account or card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 980px; position: relative; overflow: hidden; box-sizing: border-box; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-variant-numeric: tabular-nums; background: {{c.bg}}; color: {{c.t1}}">

<div aria-hidden="true" style="padding: 28px 20px; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 30px; font-weight: 800">Accounts and cards</span>
<span style="height: 220px; border-radius: 22px; background: {{c.s1}}"></span>
<span style="height: 104px; border-radius: 20px; background: #1D4ED8"></span>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: {{c.scrim}}"></div>

<section aria-label="{{title}}" style="position: absolute; left: 0; right: 0; bottom: 0; top: 72px; background: {{c.s1}}; border-radius: 30px 30px 0 0; padding: 10px 20px 28px; display: flex; flex-direction: column; gap: 16px">
<span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: {{c.line}}"></span>
<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 22px; font-weight: 800">{{title}}</h1>
<a href="Accounts.dc.html" aria-label="Close" style="width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; background: {{c.s2}}; color: {{c.t1}}">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
</div>

<div role="group" aria-label="Type" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 18px; background: {{c.s2}}">
<button onClick="{{pickBankType}}" aria-pressed="{{bankPressed}}" style="height: 42px; border-radius: 14px; border: 0; background: {{bankBg}}; color: {{bankFg}}; font-family: inherit; font-size: 14px; font-weight: 800">Bank account</button>
<button onClick="{{pickCardType}}" aria-pressed="{{cardPressed}}" style="height: 42px; border-radius: 14px; border: 0; background: {{cardBg}}; color: {{cardFg}}; font-family: inherit; font-size: 14px; font-weight: 800">Credit card</button>
</div>

<div aria-label="Preview" style="height: 132px; box-sizing: border-box; border-radius: 20px; padding: 16px 18px; background: {{preview.color}}; color: #FFFFFF; display: flex; flex-direction: column; justify-content: space-between; transition: background 300ms ease">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 13px; font-weight: 700">{{preview.bank}}</span>
<span style="padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,0.2); font-size: 11px; font-weight: 700">{{preview.kind}}</span>
</div>
<div style="display: flex; align-items: flex-end; justify-content: space-between">
<span style="display: flex; align-items: center; gap: 10px"><span aria-hidden="true" style="width: 30px; height: 22px; border-radius: 5px; background: #FCD34D"></span><span style="font-size: 20px; font-weight: 800">{{preview.nick}}</span></span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 600; letter-spacing: 2px">•••• {{preview.last4}}</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="bankq" style="font-size: 12px; font-weight: 700; color: {{c.t3}}">Bank</label>
<div style="display: flex; flex-direction: column; border-radius: 18px; border: {{fieldBorder}}; background: {{c.s2}}; overflow: hidden">
<div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{c.t3}}" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M16.5 16.5L21 21"></path></svg>
<input id="bankq" role="combobox" aria-expanded="{{openAttr}}" autocomplete="off" value="{{query}}" onChange="{{setQuery}}" onFocus="{{openList}}" placeholder="Search your bank" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: {{c.t1}}; font-family: inherit; font-size: 16px; font-weight: 700; padding: 0">
<button onClick="{{toggleList}}" aria-label="Show all banks" style="width: 36px; height: 36px; margin-right: -8px; border: 0; background: transparent; color: {{c.t2}}; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="transform: rotate({{chevron}}); transition: transform 200ms ease"><path d="M6 9l6 6 6-6"></path></svg>
</button>
</div>
<sc-if value="{{open}}" hint-placeholder-val="{{ false }}">
<div role="listbox" style="display: flex; flex-direction: column; border-top: 1px solid {{c.line}}; max-height: 232px; overflow-y: auto">
<sc-for list="{{results}}" as="r" hint-placeholder-count="3">
<button role="option" onClick="{{r.pick}}" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 14px; border: 0; border-bottom: 1px solid {{c.line}}; background: transparent; color: {{c.t1}}; font-family: inherit; text-align: left">
<span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 9px; background: {{r.color}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800">{{r.initials}}</span>
<span style="flex: 1; font-size: 15px"><span>{{r.pre}}</span><span style="font-weight: 800; color: {{accent}}">{{r.hit}}</span><span>{{r.post}}</span></span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{c.t3}}">{{r.code}}</span>
</button>
</sc-for>
<sc-if value="{{showOther}}" hint-placeholder-val="{{ false }}">
<button role="option" onClick="{{pickOther}}" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 14px; border: 0; background: transparent; color: {{c.t2}}; font-family: inherit; font-size: 14px; font-weight: 600; text-align: left">
<span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 9px; border: 1.5px dashed {{c.t3}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-weight: 800">+</span>
Use “{{query}}” as a new bank
</button>
</sc-if>
</div>
</sc-if>
</div>
<sc-if value="{{showCode}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 12px; color: {{c.t3}}">SMS from <span style="font-family: 'JetBrains Mono', monospace; color: {{c.t2}}">{{code}}</span> will be linked here, whatever the prefix.</p>
</sc-if>
</div>

<div style="display: flex; flex-direction: column; border-radius: 18px; border: 1px solid {{c.line}}; overflow: hidden">
<label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 54px; padding: 0 14px; border-bottom: 1px solid {{c.line}}">
<span style="font-size: 14px; color: {{c.t2}}">Nickname</span>
<input value="{{nick}}" onChange="{{setNick}}" placeholder="{{nickHint}}" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: {{c.t1}}; font-family: inherit; font-size: 16px; font-weight: 700; text-align: right; padding: 0">
</label>
<label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 54px; padding: 0 14px; border-bottom: 1px solid {{c.line}}">
<span style="font-size: 14px; color: {{c.t2}}">Last four digits</span>
<input value="{{last4}}" onChange="{{setLast4}}" inputmode="numeric" maxlength="4" placeholder="0000" style="width: 96px; border: 0; outline: none; background: transparent; color: {{c.t1}}; font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 600; letter-spacing: 4px; text-align: right; padding: 0">
</label>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 54px; padding: 0 14px">
<span style="font-size: 14px; color: {{c.t2}}">{{defaultLabel}}</span>
<button onClick="{{toggleDefault}}" role="switch" aria-checked="{{defChecked}}" aria-label="{{defaultLabel}}" style="width: 52px; height: 32px; flex-shrink: 0; border-radius: 16px; border: 0; padding: 3px; background: {{switchBg}}; display: flex; justify-content: {{switchAlign}}; transition: background 200ms ease">
<span style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF"></span>
</button>
</div>
</div>

<button style="margin-top: auto; width: 100%; height: 56px; flex-shrink: 0; border-radius: 28px; border: 0; background: {{c.money}}; color: {{c.onAccent}}; font-family: inherit; font-size: 17px; font-weight: 800">{{saveText}}</button>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"type":{"editor":"enum","options":["bank","card"],"default":"bank"},"$preview":{"width":390,"height":980}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const card = props && props.type === 'card';
    this.state = card
      ? { type: 'card', query: 'YES BANK', bank: 'YES BANK', open: false, nick: 'Kiwi', last4: '4417', def: true }
      : { type: 'bank', query: 'hd', bank: null, open: true, nick: '', last4: '', def: false };
  }
  pal(t) {
    if (t === 'light') return {bg:'#F3F4F8',s1:'#FFFFFF',s2:'#ECEEF3',line:'#DDE1E9',t1:'#11141B',t2:'#434A58',t3:'#5D6474',money:'#047857',card:'#6D28D9',onAccent:'#FFFFFF',off:'#C3C8D2',scrim:'rgba(17,20,27,0.45)',blank:'#64748B'};
    return {bg:'#0D0F14',s1:'#161922',s2:'#1F2330',line:'#2B3040',t1:'#F3F5F9',t2:'#B6BCC9',t3:'#8F96A6',money:'#34D399',card:'#C4A5FF',onAccent:'#0D0F14',off:'#3A4050',scrim:'rgba(0,0,0,0.6)',blank:'#3A4050'};
  }
  renderVals() {
    const c = this.pal(this.props.theme);
    const s = this.state || {};
    const isCard = s.type === 'card';
    const accent = isCard ? c.card : c.money;
    const all = [
      { name: 'HDFC Bank', color: '#1E3A8A', code: 'HDFCBK' },
      { name: 'HDFC Bank Credit Cards', color: '#1E3A8A', code: 'HDFCBK', cardOnly: true },
      { name: 'ICICI Bank', color: '#9A3412', code: 'ICICIT' },
      { name: 'State Bank of India', color: '#155E75', code: 'SBIINB' },
      { name: 'Federal Bank', color: '#A16207', code: 'FEDBNK' },
      { name: 'Indian Bank', color: '#0F766E', code: 'INDBNK' },
      { name: 'YES BANK', color: '#1D4ED8', code: 'YESBNK' },
      { name: 'RBL Bank', color: '#7C2D12', code: 'RBLBNK' },
      { name: 'Axis Bank', color: '#831843', code: 'AXISBK' },
      { name: 'Kotak Mahindra Bank', color: '#B91C1C', code: 'KOTAKB' },
      { name: 'IDFC FIRST Bank', color: '#7F1D1D', code: 'IDFCFB' },
      { name: 'IndusInd Bank', color: '#78350F', code: 'INDUSB' },
      { name: 'Bank of Baroda', color: '#C2410C', code: 'BOBTXN' },
      { name: 'Canara Bank', color: '#1E40AF', code: 'CANBNK' },
      { name: 'Punjab National Bank', color: '#9F1239', code: 'PNBSMS' }
    ].filter((b) => isCard || !b.cardOnly);
    const q = (s.query || '').trim().toLowerCase();
    const chosen = all.find((b) => b.name === s.bank) || null;
    const matches = all.filter((b) => !q || chosen || b.name.toLowerCase().includes(q));
    const results = matches.map((b) => {
      const idx = q && !chosen ? b.name.toLowerCase().indexOf(q) : -1;
      return {
        color: b.color, code: b.code,
        initials: b.name.replace(/[^A-Z]/g, '').slice(0, 2) || b.name.slice(0, 2).toUpperCase(),
        pre: idx >= 0 ? b.name.slice(0, idx) : b.name,
        hit: idx >= 0 ? b.name.slice(idx, idx + q.length) : '',
        post: idx >= 0 ? b.name.slice(idx + q.length) : '',
        pick: () => this.setState({ bank: b.name, query: b.name, open: false })
      };
    });
    return {
      c,
      accent,
      title: isCard ? 'Add credit card' : 'Add bank account',
      pickBankType: () => this.setState({ type: 'bank' }),
      pickCardType: () => this.setState({ type: 'card' }),
      bankPressed: isCard ? 'false' : 'true',
      cardPressed: isCard ? 'true' : 'false',
      bankBg: isCard ? 'transparent' : c.money,
      bankFg: isCard ? c.t2 : c.onAccent,
      cardBg: isCard ? c.card : 'transparent',
      cardFg: isCard ? c.onAccent : c.t2,
      preview: {
        color: chosen ? chosen.color : c.blank,
        bank: chosen ? chosen.name : 'Choose a bank',
        kind: isCard ? 'Credit card' : 'Used for UPI',
        nick: s.nick || 'Nickname',
        last4: (s.last4 || '').padEnd(4, '0')
      },
      fieldBorder: s.open ? '1.5px solid ' + accent : '1.5px solid transparent',
      query: s.query,
      setQuery: (e) => this.setState({ query: e.target.value, bank: null, open: true }),
      openList: () => this.setState({ open: true }),
      toggleList: () => this.setState({ open: !s.open }),
      open: !!s.open,
      openAttr: s.open ? 'true' : 'false',
      chevron: s.open ? '180deg' : '0deg',
      results,
      showOther: !!q && !chosen && results.length < 3,
      pickOther: () => this.setState({ bank: null, open: false }),
      showCode: !!chosen && !s.open,
      code: chosen ? chosen.code : '',
      nick: s.nick,
      setNick: (e) => this.setState({ nick: e.target.value }),
      nickHint: isCard ? 'e.g. Kiwi' : 'e.g. Primary',
      last4: s.last4,
      setLast4: (e) => this.setState({ last4: e.target.value.replace(/[^0-9]/g, '').slice(0, 4) }),
      defaultLabel: isCard ? 'Default credit card' : 'Default for UPI',
      defChecked: s.def ? 'true' : 'false',
      toggleDefault: () => this.setState({ def: !s.def }),
      switchBg: s.def ? accent : c.off,
      switchAlign: s.def ? 'flex-end' : 'flex-start',
      saveText: isCard ? 'Add card' : 'Add account'
    };
  }
}
</script>
</body>
</html>
