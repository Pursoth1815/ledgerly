<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add task</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-variant-numeric: tabular-nums; background: {{c.bg}}; color: {{c.t1}}">

<div aria-hidden="true" style="padding: 28px 20px; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 34px; font-weight: 800">Planner</span>
<span style="height: 190px; border-radius: 20px; background: {{c.s1}}"></span>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: {{c.scrim}}"></div>

<section aria-label="New task" style="position: absolute; left: 0; right: 0; bottom: 0; top: 110px; background: {{c.s1}}; border-radius: 30px 30px 0 0; padding: 10px 20px 28px; display: flex; flex-direction: column; gap: 16px">
<span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: {{c.line}}"></span>
<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 22px; font-weight: 800">New task</h1>
<a href="Tasks.dc.html" aria-label="Close" style="width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; background: {{c.s2}}; color: {{c.t1}}">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
</div>

<div style="border-radius: 20px; background: {{c.notesT}}; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
<label style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 11px; font-weight: 700; color: {{c.notes}}">Task</span>
<input value="{{title}}" onChange="{{setTitle}}" placeholder="What needs doing?" style="border: 0; outline: none; background: transparent; color: {{c.t1}}; font-family: inherit; font-size: 20px; font-weight: 800; padding: 0">
</label>
<input aria-label="Details" placeholder="Add details (optional)" style="border: 0; outline: none; background: transparent; color: {{c.t2}}; font-family: inherit; font-size: 14px; padding: 0">
</div>

<sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 700; color: {{c.t3}}">{{r.label}}</span>
<div role="group" aria-label="{{r.label}}" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{r.options}}" as="o" hint-placeholder-count="3">
<button onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="height: 38px; padding: 0 14px; border-radius: 19px; border: {{o.border}}; background: {{o.bg}}; color: {{o.fg}}; font-family: inherit; font-size: 13px; font-weight: 700">{{o.label}}</button>
</sc-for>
</div>
</div>
</sc-for>

<div style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 16px; border-radius: 18px; border: 1px solid {{c.line}}">
<span style="font-size: 14px; color: {{c.t2}}">Time</span>
<button style="border: 0; background: transparent; color: {{c.t1}}; font-family: inherit; font-size: 16px; font-weight: 800">18:00 ›</button>
</div>

<button style="margin-top: auto; width: 100%; height: 56px; flex-shrink: 0; border-radius: 28px; border: 0; background: {{c.money}}; color: {{c.onAccent}}; font-family: inherit; font-size: 17px; font-weight: 800">Add task</button>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { title: 'Call electrician', due: 'Today', remind: 'At the time', repeat: 'None' };
  }
  pal(t) {
    if (t === 'light') return {bg:'#F3F4F8',s1:'#FFFFFF',s2:'#ECEEF3',line:'#DDE1E9',t1:'#11141B',t2:'#434A58',t3:'#5D6474',notes:'#735E3B',notesT:'#F3ECE0',money:'#047857',onAccent:'#FFFFFF',scrim:'rgba(17,20,27,0.45)'};
    return {bg:'#0D0F14',s1:'#161922',s2:'#1F2330',line:'#2B3040',t1:'#F3F5F9',t2:'#B6BCC9',t3:'#8F96A6',notes:'#E6CDA3',notesT:'rgba(230,205,163,0.13)',money:'#34D399',onAccent:'#0D0F14',scrim:'rgba(0,0,0,0.6)'};
  }
  renderVals() {
    const c = this.pal(this.props.theme);
    const s = this.state || {};
    const row = (label, key, options) => ({
      label,
      options: options.map((o) => ({
        label: o,
        pick: () => this.setState({ [key]: o }),
        pressed: s[key] === o ? 'true' : 'false',
        border: s[key] === o ? '1.5px solid ' + c.notes : '1px solid ' + c.line,
        bg: s[key] === o ? c.notesT : 'transparent',
        fg: s[key] === o ? c.notes : c.t2
      }))
    });
    return {
      c,
      title: s.title,
      setTitle: (e) => this.setState({ title: e.target.value }),
      rows: [
        row('Due', 'due', ['Today', 'Tomorrow', 'Pick a date']),
        row('Remind me', 'remind', ['At the time', '10 min before', '1 hour before', 'No reminder']),
        row('Repeat', 'repeat', ['None', 'Daily', 'Weekly', 'Monthly'])
      ]
    };
  }
}
</script>
</body>
</html>
