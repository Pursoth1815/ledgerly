<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Capture sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-variant-numeric: tabular-nums; background: {{c.bg}}; color: {{c.t1}}">

<div aria-hidden="true" style="padding: 28px 20px; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 34px; font-weight: 800">Today</span>
<span style="height: 180px; border-radius: 24px; background: {{c.s1}}"></span>
<span style="height: 120px; border-radius: 24px; background: {{c.travelT}}"></span>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: {{c.scrim}}"></div>

<section aria-label="Capture" style="position: absolute; left: 0; right: 0; bottom: 0; top: 150px; background: {{c.s1}}; border-radius: 30px 30px 0 0; padding: 10px 20px 28px; display: flex; flex-direction: column; gap: 18px">
<span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: {{c.line}}"></span>
<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 22px; font-weight: 800">Add</h1>
<a href="Main.dc.html" aria-label="Close" style="width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; background: {{c.s2}}; color: {{c.t1}}">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
</div>

<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{actions}}" as="a" hint-placeholder-count="5">
<a href="{{a.href}}" style="height: 76px; border-radius: 18px; background: {{a.tint}}; color: {{c.t1}}; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 12px; font-weight: 700">
<span style="width: 30px; height: 30px; border-radius: 15px; background: {{a.color}}; color: {{c.onAccent}}; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 6v12M6 12h12"></path></svg>
</span>{{a.label}}</a>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="cmd" style="font-size: 13px; font-weight: 700; color: {{c.t3}}">Or type one line</label>
<div style="display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 16px; border-radius: 18px; background: {{c.s2}}; border: 1.5px solid {{c.money}}">
<span aria-hidden="true" style="font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 600; color: {{c.money}}">›</span>
<input id="cmd" value="spent 250 on lunch hdfc upi" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: {{c.t1}}; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500">
</div>
</div>

<article aria-label="Expense draft" style="border-radius: 22px; background: {{c.moneyT}}; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 13px; font-weight: 700; color: {{c.money}}">Expense draft</span>
<span style="font-size: 12px; color: {{c.t2}}">Today</span>
</div>
<span style="font-size: 30px; font-weight: 800; letter-spacing: -0.5px">₹250.00</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<span style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 14px; background: {{c.s1}}; font-size: 12px; font-weight: 700"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{c.food}}"></span>Food</span>
<span style="display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border-radius: 14px; background: {{c.s1}}; font-size: 12px; font-weight: 800; color: {{c.money}}">UPI</span>
<span style="display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border-radius: 14px; background: {{c.s1}}; font-size: 12px; font-weight: 700; color: {{c.t2}}">Salary account ••4821</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button style="height: 46px; border-radius: 23px; border: 1.5px solid {{c.money}}; background: transparent; color: {{c.t1}}; font-family: inherit; font-size: 14px; font-weight: 700">Review</button>
<button style="height: 46px; border-radius: 23px; border: 0; background: {{c.money}}; color: {{c.onAccent}}; font-family: inherit; font-size: 14px; font-weight: 800">Looks Good ✓</button>
</div>
</article>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 700; color: {{c.t3}}">Try</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{tries}}" as="t" hint-placeholder-count="4">
<button style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid {{c.line}}; background: transparent; color: {{c.t2}}; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500">{{t}}</button>
</sc-for>
</div>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  pal(t) {
    if (t === 'light') return {bg:'#F3F4F8',s1:'#FFFFFF',s2:'#ECEEF3',line:'#DDE1E9',t1:'#11141B',t2:'#434A58',t3:'#5D6474',money:'#047857',moneyT:'#E1F4EA',lend:'#A14A06',lendT:'#FDF0D8',travel:'#4338CA',travelT:'#E8E9FD',notes:'#735E3B',notesT:'#F3ECE0',food:'#E8590C',onAccent:'#FFFFFF',scrim:'rgba(17,20,27,0.45)'};
    return {bg:'#0D0F14',s1:'#161922',s2:'#1F2330',line:'#2B3040',t1:'#F3F5F9',t2:'#B6BCC9',t3:'#8F96A6',money:'#34D399',moneyT:'rgba(52,211,153,0.14)',lend:'#FBBF24',lendT:'rgba(251,191,36,0.13)',travel:'#8F98FF',travelT:'rgba(143,152,255,0.16)',notes:'#E6CDA3',notesT:'rgba(230,205,163,0.13)',food:'#FF8A4C',onAccent:'#0D0F14',scrim:'rgba(0,0,0,0.6)'};
  }
  renderVals() {
    const c = this.pal(this.props.theme);
    const actions = [
      { label: 'Expense', color: c.money, tint: c.moneyT, href: 'AddExpense.dc.html' },
      { label: 'Loan', color: c.lend, tint: c.lendT, href: 'Lending.dc.html' },
      { label: 'Trip', color: c.travel, tint: c.travelT, href: 'Ticket.dc.html' },
      { label: 'Note', color: c.notes, tint: c.notesT, href: 'Notes.dc.html' },
      { label: 'Task', color: c.notes, tint: c.notesT, href: 'Tasks.dc.html' }
    ];
    const tries = ['who owes me', 'next trip', 'tasks today', 'lent 5000 to Arun'];
    return { c, actions, tries };
  }
}
</script>
</body>
</html>
