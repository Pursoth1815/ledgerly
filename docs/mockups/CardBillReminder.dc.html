<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Card bill reminder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 420px; box-sizing: border-box; padding: 28px 14px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-variant-numeric: tabular-nums; background: {{c.bg}}; color: {{c.t1}}">
<article aria-label="Notification: Kiwi bill is due today" style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 24px; background: {{c.s1}}; border: 1px solid {{c.line}}">
<div style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: {{c.t3}}">
<span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 7px; background: {{c.card}}; color: {{c.onAccent}}; display: flex; align-items: center; justify-content: center">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M3 10h18"></path></svg>
</span>
<span>Loopd · 9:00 am</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 16px; font-weight: 800">Kiwi bill is due today</h1>
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: {{c.t2}}">YES BANK ••4417. Pay it in your bank or card app.</p>
</div>
</article>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":420}}'>
class Component extends DCLogic {
  pal(t) {
    if (t === 'light') return {bg:'#F3F4F8',s1:'#FFFFFF',line:'#DDE1E9',t1:'#11141B',t2:'#434A58',t3:'#5D6474',card:'#6D28D9',onAccent:'#FFFFFF'};
    return {bg:'#0D0F14',s1:'#161922',line:'#2B3040',t1:'#F3F5F9',t2:'#B6BCC9',t3:'#8F96A6',card:'#C4A5FF',onAccent:'#0D0F14'};
  }
  renderVals() {
    return { c: this.pal(this.props.theme) };
  }
}
</script>
</body>
</html>
