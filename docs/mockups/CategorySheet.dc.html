<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Category sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: {{rootH}}; position: relative; overflow: hidden; box-sizing: border-box; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-variant-numeric: tabular-nums; background: {{c.bg}}; color: {{c.t1}}">

<div aria-hidden="true" style="padding: 28px 20px; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 34px; font-weight: 800">{{ghostTitle}}</span>
<span style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<span style="height: 120px; border-radius: 22px; background: {{ghostA}}"></span>
<span style="height: 120px; border-radius: 22px; background: {{ghostB}}"></span>
</span>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: {{c.scrim}}"></div>

<section aria-label="{{title}}" style="position: absolute; left: 0; right: 0; bottom: 0; top: 72px; background: {{c.s1}}; border-radius: 30px 30px 0 0; padding: 10px 20px 28px; display: flex; flex-direction: column; gap: 16px">
<span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: {{c.line}}"></span>
<div style="display: flex; align-items: center; gap: 10px">
<sc-if value="{{showBack}}" hint-placeholder-val="{{ false }}">
<button onClick="{{toList}}" aria-label="Back to categories" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 20px; border: 0; background: {{c.s2}}; color: {{c.t1}}; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
</button>
</sc-if>
<h1 style="flex: 1; margin: 0; font-size: 22px; font-weight: 800">{{title}}</h1>
<a href="{{closeHref}}" aria-label="Close" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 20px; display: flex; align-items: center; justify-content: center; background: {{c.s2}}; color: {{c.t1}}">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
</div>

<sc-if value="{{isList}}" hint-placeholder-val="{{ true }}">
<p style="margin: -6px 0 0; font-size: 13px; color: {{c.t2}}">Tap one to rename it or change its colour and icon.</p>
<div style="display: flex; flex-direction: column; border-radius: 20px; border: 1px solid {{c.line}}; overflow: hidden">
<sc-for list="{{cats}}" as="k" hint-placeholder-count="12">
<button style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 14px; border: 0; border-bottom: {{k.divider}}; background: transparent; color: {{c.t1}}; font-family: inherit; text-align: left">
<span style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 11px; background: {{k.color}}; color: {{k.glyph}}; display: flex; align-items: center; justify-content: center">
<sc-if value="{{k.ic.food}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8a2 2 0 0 0 2 2v8M7 3v4M10 3v4M7 7h3M17 3c-2 0-3 2-3 5s1 4 3 4v9"></path></svg></sc-if>
<sc-if value="{{k.ic.snack}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h12v5a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5z"></path><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17M8 3v2M12 3v2"></path></svg></sc-if>
<sc-if value="{{k.ic.grocery}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h16l-1.5 9a2 2 0 0 1-2 1.7h-9a2 2 0 0 1-2-1.7z"></path><path d="M8 10l3-6M16 10l-3-6M9 14v3M15 14v3"></path></svg></sc-if>
<sc-if value="{{k.ic.bus}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="15" rx="3"></rect><path d="M4 11h16M8 18v3M16 18v3"></path></svg></sc-if>
<sc-if value="{{k.ic.bag}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg></sc-if>
<sc-if value="{{k.ic.bill}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6M9 16h3"></path></svg></sc-if>
<sc-if value="{{k.ic.health}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.6a4.2 4.2 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"></path><path d="M12 10.5v5M9.5 13h5"></path></svg></sc-if>
<sc-if value="{{k.ic.fuel}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M4 21h12M8 8h4"></path><path d="M15 9l3 2v6a1.5 1.5 0 0 0 3 0V9l-3-3"></path></svg></sc-if>
<sc-if value="{{k.ic.star}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg></sc-if>
<sc-if value="{{k.ic.home}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V20H4z"></path><path d="M10 20v-5h4v5"></path></svg></sc-if>
<sc-if value="{{k.ic.repeat}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l3 3-3 3M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3M20 13v2a4 4 0 0 1-4 4H4"></path></svg></sc-if>
<sc-if value="{{k.ic.gift}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="5" rx="1"></rect><path d="M5 13v8h14v-8M12 8v13M12 8S10.5 3 8 3a2.5 2.5 0 0 0 0 5zM12 8s1.5-5 4-5a2.5 2.5 0 0 1 0 5z"></path></svg></sc-if>
</span>
<span style="flex: 1; font-size: 15px; font-weight: 700">{{k.name}}</span>
<span style="font-size: 13px; color: {{c.t3}}">{{k.spent}}</span>
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{c.t3}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
</button>
</sc-for>
</div>
<button onClick="{{toNew}}" style="margin-top: auto; width: 100%; height: 56px; flex-shrink: 0; border-radius: 28px; border: 0; background: {{c.money}}; color: {{c.onAccent}}; font-family: inherit; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>New category</button>
</sc-if>

<sc-if value="{{isNew}}" hint-placeholder-val="{{ false }}">
<div aria-label="Preview" style="display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 22px; background: {{pvTint}}; transition: background 250ms ease">
<span style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 18px; background: {{pv.color}}; color: {{pv.glyph}}; display: flex; align-items: center; justify-content: center; transition: background 250ms ease">
<sc-if value="{{pv.ic.food}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8a2 2 0 0 0 2 2v8M7 3v4M10 3v4M7 7h3M17 3c-2 0-3 2-3 5s1 4 3 4v9"></path></svg></sc-if>
<sc-if value="{{pv.ic.snack}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h12v5a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5z"></path><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17M8 3v2M12 3v2"></path></svg></sc-if>
<sc-if value="{{pv.ic.grocery}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h16l-1.5 9a2 2 0 0 1-2 1.7h-9a2 2 0 0 1-2-1.7z"></path><path d="M8 10l3-6M16 10l-3-6M9 14v3M15 14v3"></path></svg></sc-if>
<sc-if value="{{pv.ic.bus}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="15" rx="3"></rect><path d="M4 11h16M8 18v3M16 18v3"></path></svg></sc-if>
<sc-if value="{{pv.ic.bag}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg></sc-if>
<sc-if value="{{pv.ic.bill}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6M9 16h3"></path></svg></sc-if>
<sc-if value="{{pv.ic.health}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.6a4.2 4.2 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"></path><path d="M12 10.5v5M9.5 13h5"></path></svg></sc-if>
<sc-if value="{{pv.ic.fuel}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M4 21h12M8 8h4"></path><path d="M15 9l3 2v6a1.5 1.5 0 0 0 3 0V9l-3-3"></path></svg></sc-if>
<sc-if value="{{pv.ic.star}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg></sc-if>
<sc-if value="{{pv.ic.home}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V20H4z"></path><path d="M10 20v-5h4v5"></path></svg></sc-if>
<sc-if value="{{pv.ic.repeat}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l3 3-3 3M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3M20 13v2a4 4 0 0 1-4 4H4"></path></svg></sc-if>
<sc-if value="{{pv.ic.gift}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="5" rx="1"></rect><path d="M5 13v8h14v-8M12 8v13M12 8S10.5 3 8 3a2.5 2.5 0 0 0 0 5zM12 8s1.5-5 4-5a2.5 2.5 0 0 1 0 5z"></path></svg></sc-if>
<sc-if value="{{pv.ic.id}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><circle cx="9" cy="11" r="2"></circle><path d="M6 16c.7-1.3 1.8-2 3-2s2.3.7 3 2M14.5 10h4M14.5 13.5h3"></path></svg></sc-if>
<sc-if value="{{pv.ic.shield}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"></path><path d="M9 12l2 2 4-4"></path></svg></sc-if>
<sc-if value="{{pv.ic.car}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l1.8-5a2 2 0 0 1 1.9-1.3h6.6a2 2 0 0 1 1.9 1.3L19 13"></path><rect x="3" y="13" width="18" height="5" rx="2"></rect><path d="M6 18v2M18 18v2"></path></svg></sc-if>
<sc-if value="{{pv.ic.edu}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9.5L12 5l10 4.5L12 14z"></path><path d="M6 11.5V16c0 1.4 2.7 3 6 3s6-1.6 6-3v-4.5M22 9.5V15"></path></svg></sc-if>
<sc-if value="{{pv.ic.doc}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v14H7z"></path><path d="M14 3v4h4M10 12h5M10 16h5"></path></svg></sc-if>
</span>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-size: 19px; font-weight: 800">{{pvName}}</span>
<span style="font-size: 12px; color: {{c.t2}}">{{pvSub}}</span>
</span>
</div>

<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 700; color: {{c.t3}}">Name</span>
<input value="{{nameVal}}" onChange="{{setName}}" placeholder="e.g. Coffee" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 1.5px solid {{pv.color}}; outline: none; background: {{c.s2}}; color: {{c.t1}}; font-family: inherit; font-size: 17px; font-weight: 700">
</label>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 700; color: {{c.t3}}">Colour</span>
<div role="group" aria-label="Colour" style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{colours}}" as="k" hint-placeholder-count="8">
<button onClick="{{k.pick}}" aria-pressed="{{k.pressed}}" aria-label="Colour {{k.n}}" style="height: 44px; border: 0; padding: 0; background: transparent; display: flex; align-items: center; justify-content: center">
<span style="width: 30px; height: 30px; border-radius: 15px; background: {{k.dot}}; box-shadow: {{k.ring}}; transition: box-shadow 160ms ease"></span>
</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 700; color: {{c.t3}}">Icon</span>
<div role="group" aria-label="Icon" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{icons}}" as="g" hint-placeholder-count="12">
<button onClick="{{g.pick}}" aria-pressed="{{g.pressed}}" aria-label="{{g.label}}" style="height: 48px; border-radius: 14px; border: {{g.border}}; background: {{g.bg}}; color: {{g.fg}}; display: flex; align-items: center; justify-content: center; transition: background 160ms ease">
<sc-if value="{{g.ic.food}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8a2 2 0 0 0 2 2v8M7 3v4M10 3v4M7 7h3M17 3c-2 0-3 2-3 5s1 4 3 4v9"></path></svg></sc-if>
<sc-if value="{{g.ic.snack}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h12v5a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5z"></path><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17M8 3v2M12 3v2"></path></svg></sc-if>
<sc-if value="{{g.ic.grocery}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h16l-1.5 9a2 2 0 0 1-2 1.7h-9a2 2 0 0 1-2-1.7z"></path><path d="M8 10l3-6M16 10l-3-6M9 14v3M15 14v3"></path></svg></sc-if>
<sc-if value="{{g.ic.bus}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="15" rx="3"></rect><path d="M4 11h16M8 18v3M16 18v3"></path></svg></sc-if>
<sc-if value="{{g.ic.bag}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg></sc-if>
<sc-if value="{{g.ic.bill}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6M9 16h3"></path></svg></sc-if>
<sc-if value="{{g.ic.health}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.6a4.2 4.2 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"></path><path d="M12 10.5v5M9.5 13h5"></path></svg></sc-if>
<sc-if value="{{g.ic.fuel}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M4 21h12M8 8h4"></path><path d="M15 9l3 2v6a1.5 1.5 0 0 0 3 0V9l-3-3"></path></svg></sc-if>

<sc-if value="{{g.ic.home}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V20H4z"></path><path d="M10 20v-5h4v5"></path></svg></sc-if>

<button style="margin-top: auto; width: 100%; height: 56px; flex-shrink: 0; border-radius: 28px; border: 0; background: {{c.money}}; color: {{c.onAccent}}; font-family: inherit; font-size: 17px; font-weight: 800">Add category</button>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"kind":{"editor":"enum","options":["expense","vault"],"default":"expense"},"view":{"editor":"enum","options":["list","new"],"default":"list"},"$preview":{"width":390,"height":1060}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const vault = props && props.kind === 'vault';
    this.state = {
      view: vault ? 'new' : (props && props.view === 'new' ? 'new' : 'list'),
      name: vault ? 'Property' : 'Coffee',
      colour: vault ? 5 : 0,
      icon: vault ? 'home' : 'snack'
    };
  }
  pal(t) {
    if (t === 'light') return {bg:'#F3F4F8',s1:'#FFFFFF',s2:'#ECEEF3',line:'#DDE1E9',t1:'#11141B',t2:'#434A58',t3:'#5D6474',money:'#047857',onAccent:'#FFFFFF',scrim:'rgba(17,20,27,0.45)'};
    return {bg:'#0D0F14',s1:'#161922',s2:'#1F2330',line:'#2B3040',t1:'#F3F5F9',t2:'#B6BCC9',t3:'#8F96A6',money:'#34D399',onAccent:'#0D0F14',scrim:'rgba(0,0,0,0.6)'};
  }
  renderVals() {
    const c = this.pal(this.props.theme);
    const s = this.state || {};
    const vault = this.props.kind === 'vault';
    const allKeys = ['food','snack','grocery','bus','bag','bill','health','fuel','star','home','repeat','gift','id','shield','car','edu','doc'];
    const flags = (key) => { const o = {}; allKeys.forEach((k) => { o[k] = k === key; }); return o; };
    const bright = ['#FF8A4C','#F472B6','#EAB308','#60A5FA','#A78BFA','#22D3EE','#2DD4BF','#F97316'];
    const deep = ['#2563EB','#047857','#B45309','#4F46E5','#BE185D','#0E7490','#7C3AED','#475569'];
    const palette = vault ? deep : bright;
    const glyph = vault ? '#FFFFFF' : '#0D0F14';
    const cats = [
      ['Food', 'food', 0, '₹3,240'], ['Snacks', 'snack', 1, '₹860'], ['Groceries', 'grocery', 2, '₹2,150'],
      ['Travel', 'bus', 3, '₹1,890'], ['Shopping', 'bag', 4, '₹4,100'], ['Bills', 'bill', 5, '₹2,300'],
      ['Health', 'health', 6, '₹640'], ['Fuel', 'fuel', 7, '₹1,200'], ['Fun', 'star', 1, '₹950'],
      ['Rent', 'home', 3, '₹0'], ['Subscriptions', 'repeat', 4, '₹2,298'], ['Gifts', 'gift', 0, '₹490']
    ].map((r, i, all) => ({ name: r[0], ic: flags(r[1]), color: bright[r[2]], glyph: '#0D0F14', spent: r[3], divider: i < all.length - 1 ? '1px solid ' + c.line : '0' }));
    const iconKeys = vault
      ? [['id','Identity card'],['doc','Document'],['shield','Shield'],['home','House'],['car','Car'],['health','Health'],['edu','Education'],['bill','Receipt'],['gift','Gift'],['star','Star'],['bag','Bag'],['repeat','Repeat']]
      : [['food','Food'],['snack','Cup'],['grocery','Basket'],['bus','Bus'],['bag','Bag'],['bill','Receipt'],['health','Health'],['fuel','Fuel'],['star','Star'],['home','House'],['repeat','Repeat'],['gift','Gift']];
    const col = palette[s.colour] || palette[0];
    const icons = iconKeys.map((k) => ({
      label: k[1] + ' icon',
      ic: flags(k[0]),
      pick: () => this.setState({ icon: k[0] }),
      pressed: s.icon === k[0] ? 'true' : 'false',
      border: s.icon === k[0] ? '1.5px solid ' + col : '1px solid ' + c.line,
      bg: s.icon === k[0] ? col : 'transparent',
      fg: s.icon === k[0] ? glyph : c.t2
    }));
    const colours = palette.map((p, i) => ({
      n: String(i + 1), dot: p,
      pick: () => this.setState({ colour: i }),
      pressed: s.colour === i ? 'true' : 'false',
      ring: s.colour === i ? '0 0 0 3px ' + c.s1 + ', 0 0 0 5px ' + p : 'none'
    }));
    const isNew = s.view === 'new';
    return {
      c, cats, icons, colours,
      rootH: isNew || vault ? '980px' : '1060px',
      isList: !isNew && !vault,
      isNew: isNew || vault,
      showBack: isNew && !vault,
      toList: () => this.setState({ view: 'list' }),
      toNew: () => this.setState({ view: 'new' }),
      title: vault ? 'New Vault category' : (isNew ? 'New category' : 'Expense categories'),
      closeHref: vault ? 'Vault.dc.html' : 'More.dc.html',
      ghostTitle: vault ? 'Vault' : 'More',
      ghostA: vault ? '#2563EB' : '#3B5BDB',
      ghostB: vault ? '#047857' : '#0F766E',
      pv: { color: col, glyph, ic: flags(s.icon) },
      pvTint: c.s2,
      pvName: s.name || 'Category name',
      pvSub: vault ? 'Vault · 0 documents' : 'Expense category · shows on every payment',
      nameVal: s.name,
      setName: (e) => this.setState({ name: e.target.value })
    };
  }
}
</script>
