<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add or edit a refund</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-variant-numeric: tabular-nums; background: {{c.scrim}}; color: {{c.t1}}">
<section aria-label="{{title}}" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 10px 20px 28px; border-radius: 28px 28px 0 0; background: {{c.s1}}; display: flex; flex-direction: column; gap: 18px">
<span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: {{c.line}}"></span>
<header style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 22px; font-weight: 800">{{title}}</h1>
<p style="margin: 0; font-size: 13px; font-weight: 500; color: {{c.t2}}">Decathlon · ₹1,500 · 12 Nov</p>
</header>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<label for="amt" style="font-size: 13px; font-weight: 600; color: {{c.t3}}">Amount</label>
<div style="display: flex; align-items: baseline; justify-content: center; gap: 4px; width: 100%">
<span style="font-size: 32px; font-weight: 700; color: {{c.money}}">₹</span>
<input id="amt" inputmode="decimal" value="{{amount}}" onChange="{{setAmount}}" style="width: {{amtW}}; max-width: 300px; padding: 0; border: 0; outline: none; background: transparent; color: {{c.t1}}; font-family: inherit; font-size: 48px; font-weight: 800; letter-spacing: -1px; text-align: center; font-variant-numeric: tabular-nums">
</div>
<span style="font-size: 13px; font-weight: 600; color: {{hintColor}}">{{hint}}</span>
</div>
<div style="display: flex; flex-direction: column; border-radius: 22px; border: 1px solid {{c.line}}; overflow: hidden">
<button style="display: flex; align-items: center; justify-content: space-between; min-height: 56px; padding: 0 16px; border: 0; border-bottom: 1px solid {{c.line}}; background: transparent; color: {{c.t1}}; font-family: inherit; text-align: left">
<span style="font-size: 14px; color: {{c.t2}}">Date and time</span>
<span style="font-size: 15px; font-weight: 700">{{dateText}} ›</span>
</button>
<label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 0 16px">
<span style="font-size: 14px; color: {{c.t2}}">Note</span>
<input placeholder="Add a note" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: {{c.t1}}; font-family: inherit; font-size: 15px; font-weight: 600; text-align: right">
</label>
</div>
<sc-if value="{{isEdit}}" hint-placeholder-val="{{ false }}">
<button style="height: 52px; border-radius: 26px; border: 1.5px solid {{c.red}}; background: transparent; color: {{c.red}}; font-family: inherit; font-size: 15px; font-weight: 800">Delete refund</button>
</sc-if>
<button disabled="{{saveDisabled}}" style="height: 56px; border-radius: 28px; border: 0; background: {{c.money}}; color: {{c.onAccent}}; opacity: {{saveOpacity}}; font-family: inherit; font-size: 17px; font-weight: 800">{{saveLabel}}</button>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"edit":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { amount: props && props.edit ? '500' : '1,500' };
  }
  pal(t) {
    if (t === 'light') return {s1:'#FFFFFF',line:'#DDE1E9',t1:'#11141B',t2:'#434A58',t3:'#5D6474',money:'#047857',red:'#B91C1C',onAccent:'#FFFFFF',scrim:'#9CA3AF'};
    return {s1:'#161922',line:'#2B3040',t1:'#F3F5F9',t2:'#B6BCC9',t3:'#8F96A6',money:'#34D399',red:'#FF7B7B',onAccent:'#0D0F14',scrim:'#05060A'};
  }
  renderVals() {
    const c = this.pal(this.props.theme);
    const s = this.state || {};
    const edit = !!this.props.edit;
    const value = parseFloat(String(s.amount || '0').replace(/,/g, '')) || 0;
    const over = value > 1500;
    const blocked = over || value <= 0;
    return {
      c,
      isEdit: edit,
      title: edit ? 'Edit refund' : 'Add refund',
      amount: s.amount,
      amtW: 'calc(' + Math.max(1, String(s.amount || '').length) + 'ch + 6px)',
      setAmount: (e) => this.setState({ amount: e.target.value }),
      hint: over ? 'More than the ₹1,500 left to refund' : 'Up to ₹1,500',
      hintColor: over ? c.red : c.t3,
      dateText: edit ? '14 Nov, 4:10 pm' : 'Today, 10:00 am',
      saveLabel: edit ? 'Save changes' : 'Save refund ₹' + (s.amount || '0'),
      saveDisabled: blocked ? 'true' : null,
      saveOpacity: blocked ? '0.4' : '1'
    };
  }
}
</script>
</body>
</html>
