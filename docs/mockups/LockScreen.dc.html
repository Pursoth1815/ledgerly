<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lock screen, final ticket notice</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; box-sizing: border-box; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-variant-numeric: tabular-nums; background: {{c.wall}}; color: {{c.wallText}}">

<div style="padding-top: 88px; display: flex; flex-direction: column; align-items: center; gap: 4px">
<span style="font-size: 18px; font-weight: 600">Thursday, 19 November</span>
<span style="font-size: 88px; font-weight: 700; letter-spacing: -3px; line-height: 1">23:15</span>
</div>

<article aria-label="Kanakku notification: train leaves in 15 minutes" style="position: absolute; left: 14px; right: 14px; top: 300px; background: {{c.s1}}; color: {{c.t1}}; border-radius: 28px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: {{c.t3}}">
<span style="width: 22px; height: 22px; border-radius: 7px; background: {{c.travel}}; color: {{c.onAccent}}; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4z"></path></svg>
</span>
<span style="font-weight: 700; color: {{c.t2}}">Kanakku</span>
<span>· Travel · now</span>
<svg aria-label="Pinned" role="img" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left: auto"><path d="M9 4h6l-1 6 4 4H6l4-4zM12 14v6"></path></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 18px; font-weight: 800">Train leaves in 15 minutes</h1>
<p style="margin: 0; font-size: 14px; color: {{c.t2}}">Train 12653 · 23:30 · MS Chennai Egmore → TPJ Tiruchchirappalli</p>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 12px; border-radius: 16px; background: {{c.travelT}}">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: {{c.t2}}">Coach</span><span style="font-size: 17px; font-weight: 800">S7</span></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: {{c.t2}}">Berth</span><span style="font-size: 17px; font-weight: 800">80</span></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: {{c.t2}}">PNR</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; padding-top: 3px">4100000001</span></span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button style="height: 46px; border-radius: 23px; border: 0; background: {{c.travel}}; color: {{c.onAccent}}; font-family: inherit; font-size: 14px; font-weight: 800">Show ticket</button>
<button style="height: 46px; border-radius: 23px; border: 1.5px solid {{c.line}}; background: transparent; color: {{c.t1}}; font-family: inherit; font-size: 14px; font-weight: 700">Done</button>
</div>
</article>

<div style="position: absolute; left: 0; right: 0; bottom: 48px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; font-weight: 600">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.5"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
Swipe up to unlock
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  pal(t) {
    if (t === 'light') return {wall:'#D9DCF6',wallText:'#11141B',bg:'#F3F4F8',s1:'#FFFFFF',s2:'#ECEEF3',line:'#DDE1E9',t1:'#11141B',t2:'#434A58',t3:'#5D6474',travel:'#4338CA',travelT:'#E8E9FD',done:'#047857',onAccent:'#FFFFFF'};
    return {wall:'#171936',wallText:'#F3F5F9',bg:'#0D0F14',s1:'#1A1D27',s2:'#1F2330',line:'#2E3344',t1:'#F3F5F9',t2:'#B6BCC9',t3:'#8F96A6',travel:'#8F98FF',travelT:'rgba(143,152,255,0.16)',done:'#34D399',onAccent:'#0D0F14'};
  }
  renderVals() {
    return { c: this.pal(this.props.theme) };
  }
}
</script>
</body>
</html>
