<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 900px; position: relative; box-sizing: border-box; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-variant-numeric: tabular-nums; background: {{c.bg}}; color: {{c.t1}}">
<main style="padding: 28px 20px 120px; display: flex; flex-direction: column; gap: 16px">

<header style="display: flex; flex-direction: column; gap: 14px">
<h1 style="margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.5px">Notes</h1>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 20px; background: {{c.s2}}">
<span aria-current="page" style="height: 40px; border-radius: 16px; background: {{c.notes}}; color: {{c.onAccent}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800">Notes</span>
<a href="Tasks.dc.html" style="height: 40px; border-radius: 16px; color: {{c.t2}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; text-decoration: none">Tasks</a>
</div>
<div role="group" aria-label="Folders" style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{folders}}" as="f" hint-placeholder-count="5">
<button aria-pressed="{{f.pressed}}" style="height: 34px; padding: 0 14px; border-radius: 17px; border: {{f.border}}; background: {{f.bg}}; color: {{f.fg}}; font-family: inherit; font-size: 13px; font-weight: 700">{{f.name}}</button>
</sc-for>
</div>
</header>

<sc-for list="{{notes}}" as="n" hint-placeholder-count="4">
<article style="background: {{n.bg}}; border: 1px solid {{n.border}}; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<h2 style="margin: 0; font-size: 16px; font-weight: 800">{{n.title}}</h2>
<sc-if value="{{n.pinned}}" hint-placeholder-val="{{ false }}"><svg role="img" aria-label="Pinned" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{c.notes}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-1 6 4 4H6l4-4zM12 14v6"></path></svg></sc-if>
</div>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: {{c.t2}}; white-space: pre-line">{{n.body}}</p>
<span style="font-size: 12px; color: {{c.t3}}">{{n.meta}}</span>
</article>
</sc-for>
</main>

<a href="Capture.dc.html" aria-label="Capture" style="position: absolute; right: 20px; bottom: 104px; width: 60px; height: 60px; border-radius: 30px; background: {{c.btn}}; color: {{c.btnT}}; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
</a>

<nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 10px 8px 20px; display: flex; justify-content: space-around; align-items: flex-start; background: {{c.s1}}; border-top: 1px solid {{c.line}}">
<a href="Main.dc.html" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; font-size: 11px; font-weight: 600; color: {{c.t3}}">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V20H15v-5H9v5H4z"></path></svg>Today</a>
<a href="Accounts.dc.html" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; font-size: 11px; font-weight: 600; color: {{c.t3}}">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"></rect><path d="M3 10h18M16 15h2"></path></svg>Money</a>
<a href="Travel.dc.html" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; font-size: 11px; font-weight: 600; color: {{c.t3}}">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4z"></path><path d="M14 7v10" stroke-dasharray="2 2"></path></svg>Travel</a>
<a href="Notes.dc.html" aria-current="page" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; font-size: 11px; font-weight: 700; color: {{c.t1}}">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"></path><path d="M9 12h7M9 16h5"></path></svg>Notes</a>
<a href="Vault.dc.html" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; font-size: 11px; font-weight: 600; color: {{c.t3}}">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.5"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Vault</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  pal(t) {
    if (t === 'light') return {bg:'#F3F4F8',s1:'#FFFFFF',s2:'#ECEEF3',line:'#DDE1E9',t1:'#11141B',t2:'#434A58',t3:'#5D6474',btn:'#11141B',btnT:'#FFFFFF',notes:'#735E3B',notesT:'#F3ECE0',onAccent:'#FFFFFF'};
    return {bg:'#0D0F14',s1:'#161922',s2:'#1F2330',line:'#2B3040',t1:'#F3F5F9',t2:'#B6BCC9',t3:'#8F96A6',btn:'#F3F5F9',btnT:'#0D0F14',notes:'#E6CDA3',notesT:'rgba(230,205,163,0.13)',onAccent:'#0D0F14'};
  }
  renderVals() {
    const c = this.pal(this.props.theme);
    const folders = ['All', 'Personal', 'Home', 'Bike', 'Ideas'].map((name, i) => ({
      name,
      pressed: i === 0 ? 'true' : 'false',
      bg: i === 0 ? c.notesT : 'transparent',
      fg: i === 0 ? c.notes : c.t2,
      border: i === 0 ? '1.5px solid ' + c.notes : '1px solid ' + c.line
    }));
    const notes = [
      { title: 'Gate code and office hours', body: 'Gate code is 4471.\nSociety office: 9 am to 6 pm, closed Tuesday.', meta: 'Home · edited today', pinned: true },
      { title: 'Groceries for Sunday', body: '☑ Rice 5 kg\n☐ Curd\n☐ Tomatoes, onions', meta: 'Home · edited yesterday', pinned: false },
      { title: 'Bike service', body: 'Chain cleaned on 2 Nov. Next service at 12,000 km.', meta: 'Bike · 2 Nov', pinned: false },
      { title: 'Gift ideas', body: 'A book on design for Divya. Ask about sizes first.', meta: 'Ideas · 28 Oct', pinned: false }
    ].map((n) => ({ ...n, bg: n.pinned ? c.notesT : c.s1, border: n.pinned ? 'transparent' : c.line }));
    return { c, folders, notes };
  }
}
</script>
</body>
</html>
