<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tasks</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 960px; position: relative; box-sizing: border-box; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-variant-numeric: tabular-nums; background: {{c.bg}}; color: {{c.t1}}">
<main style="padding: 28px 20px 120px; display: flex; flex-direction: column; gap: 18px">

<header style="display: flex; flex-direction: column; gap: 14px">
<h1 style="margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.5px">Notes</h1>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 20px; background: {{c.s2}}">
<a href="Notes.dc.html" style="height: 40px; border-radius: 16px; color: {{c.t2}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; text-decoration: none">Notes</a>
<span aria-current="page" style="height: 40px; border-radius: 16px; background: {{c.notes}}; color: {{c.onAccent}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800">Tasks</span>
</div>
<div role="group" aria-label="View" style="display: flex; gap: 8px">
<button aria-pressed="true" style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1.5px solid {{c.notes}}; background: {{c.notesT}}; color: {{c.notes}}; font-family: inherit; font-size: 13px; font-weight: 700">Today</button>
<button aria-pressed="false" style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid {{c.line}}; background: transparent; color: {{c.t2}}; font-family: inherit; font-size: 13px; font-weight: 700">Upcoming</button>
<button aria-pressed="false" style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid {{c.line}}; background: transparent; color: {{c.t2}}; font-family: inherit; font-size: 13px; font-weight: 700">Completed</button>
</div>
</header>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<section aria-label="{{g.name}}" style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 13px; font-weight: 700; color: {{g.color}}">{{g.name}}</h2>
<div style="background: {{c.s1}}; border: 1px solid {{c.line}}; border-radius: 20px; padding: 4px 14px">
<sc-for list="{{g.tasks}}" as="t" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 12px; min-height: 64px; border-bottom: {{t.divider}}">
<button onClick="{{t.toggle}}" aria-pressed="{{t.pressed}}" aria-label="{{t.a11y}}" style="width: 44px; height: 44px; margin-left: -10px; flex-shrink: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
<span style="width: 24px; height: 24px; border-radius: 12px; box-sizing: border-box; border: {{t.ring}}; background: {{t.fill}}; color: {{c.onAccent}}; display: flex; align-items: center; justify-content: center">
<sc-if value="{{t.done}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
</span>
</button>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 600; color: {{t.titleColor}}; text-decoration: {{t.strike}}">{{t.title}}</span>
<span style="font-size: 12px; font-weight: 600; color: {{t.subColor}}">{{t.sub}}</span>
</span>
</div>
</sc-for>
</div>
</section>
</sc-for>
</main>

<a href="Capture.dc.html" aria-label="Capture" style="position: absolute; right: 20px; bottom: 104px; width: 60px; height: 60px; border-radius: 30px; background: {{c.btn}}; color: {{c.btnT}}; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
</a>

<nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 10px 8px 20px; display: flex; justify-content: space-around; align-items: flex-start; background: {{c.s1}}; border-top: 1px solid {{c.line}}">
<a href="Main.dc.html" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; font-size: 11px; font-weight: 600; color: {{c.t3}}">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V20H15v-5H9v5H4z"></path></svg>Today</a>
<a href="Accounts.dc.html" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; font-size: 11px; font-weight: 600; color: {{c.t3}}">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"></rect><path d="M3 10h18M16 15h2"></path></svg>Money</a>
<a href="Ticket.dc.html" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; font-size: 11px; font-weight: 600; color: {{c.t3}}">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4z"></path><path d="M14 7v10" stroke-dasharray="2 2"></path></svg>Travel</a>
<a href="Notes.dc.html" aria-current="page" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; font-size: 11px; font-weight: 700; color: {{c.t1}}">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"></path><path d="M9 12h7M9 16h5"></path></svg>Notes</a>
<a href="Vault.dc.html" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; font-size: 11px; font-weight: 600; color: {{c.t3}}">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.5"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Vault</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: { water: true } };
  }
  pal(t) {
    if (t === 'light') return {bg:'#F3F4F8',s1:'#FFFFFF',s2:'#ECEEF3',line:'#DDE1E9',t1:'#11141B',t2:'#434A58',t3:'#5D6474',btn:'#11141B',btnT:'#FFFFFF',notes:'#735E3B',notesT:'#F3ECE0',red:'#B91C1C',onAccent:'#FFFFFF'};
    return {bg:'#0D0F14',s1:'#161922',s2:'#1F2330',line:'#2B3040',t1:'#F3F5F9',t2:'#B6BCC9',t3:'#8F96A6',btn:'#F3F5F9',btnT:'#0D0F14',notes:'#E6CDA3',notesT:'rgba(230,205,163,0.13)',red:'#FF7B7B',onAccent:'#0D0F14'};
  }
  renderVals() {
    const c = this.pal(this.props.theme);
    const done = (this.state && this.state.done) || {};
    const mk = (list) => list.map((t, i) => {
      const d = !!done[t.id];
      return {
        ...t,
        done: d,
        pressed: d ? 'true' : 'false',
        a11y: (d ? 'Mark not done: ' : 'Mark done: ') + t.title,
        toggle: () => this.setState({ done: { ...done, [t.id]: !d } }),
        ring: d ? '0' : '2px solid ' + (t.overdue ? c.red : c.t3),
        fill: d ? c.notes : 'transparent',
        titleColor: d ? c.t3 : c.t1,
        strike: d ? 'line-through' : 'none',
        subColor: t.overdue && !d ? c.red : c.t3,
        divider: i < list.length - 1 ? '1px solid ' + c.line : '0'
      };
    });
    const groups = [
      { name: 'Overdue', color: c.red, tasks: mk([
        { id: 'bill', title: 'Pay electricity bill', sub: 'Yesterday · monthly', overdue: true }
      ]) },
      { name: 'Today · Sat 14 Nov', color: c.t3, tasks: mk([
        { id: 'elec', title: 'Call electrician', sub: '18:00 · reminder set' },
        { id: 'ins', title: 'Renew bike insurance', sub: 'Today · policy in Vault' },
        { id: 'water', title: 'Water the plants', sub: 'Daily' }
      ]) },
      { name: 'Next · Mon 16 Nov', color: c.t3, tasks: mk([
        { id: 'pack', title: 'Pack for Coimbatore trip', sub: '20:00 · reminder set' }
      ]) }
    ];
    return { c, groups };
  }
}
</script>
</body>
</html>
