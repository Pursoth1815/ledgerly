<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Document Vault</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 1110px; position: relative; box-sizing: border-box; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-variant-numeric: tabular-nums; background: {{c.bg}}; color: {{c.t1}}">
<main style="padding: 20px 20px 120px; display: flex; flex-direction: column; gap: 20px">
<a href="More.dc.html" aria-label="Back to More" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; background: {{c.s2}}; color: {{c.t1}}">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
</a>

<header style="display: flex; align-items: flex-start; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.5px">Vault</h1>
<span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 14px; background: {{c.vaultT}}; color: {{c.vault}}; font-size: 12px; font-weight: 700">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.5"></rect><path d="M8 11V8a4 4 0 0 1 7.5-2"></path></svg>
Unlocked · locks when you leave</span>
</div>
<button style="height: 44px; padding: 0 16px; border-radius: 22px; border: 0; background: {{c.vault}}; color: {{c.onAccent}}; font-family: inherit; font-size: 14px; font-weight: 800">+ Add</button>
</header>

<section aria-label="Categories" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{cats}}" as="k" hint-placeholder-count="8">
<button style="height: 72px; border-radius: 20px; border: 1px solid {{c.line}}; background: {{c.s1}}; color: {{c.t1}}; font-family: inherit; padding: 0 14px; display: flex; align-items: center; gap: 12px; text-align: left">
<span style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 12px; background: {{k.color}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v14H7z"></path><path d="M14 3v4h4"></path></svg>
</span>
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; font-weight: 700">{{k.name}}</span>
<span style="font-size: 12px; color: {{c.t3}}">{{k.count}}</span>
</span>
</button>
</sc-for>
</section>

<section aria-label="Expiring soon" style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 13px; font-weight: 700; color: {{c.t3}}">Expiring soon</h2>
<div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 20px; background: {{c.lendT}}">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 700">Bike insurance policy</span>
<span style="font-size: 12px; color: {{c.t2}}">Expires 2 Dec · reminder on 18 Nov</span>
</span>
<span style="padding: 4px 10px; border-radius: 999px; background: {{c.lend}}; color: {{c.onAccent}}; font-size: 12px; font-weight: 800">18 days</span>
</div>
</section>

<section aria-label="Recent documents" style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 13px; font-weight: 700; color: {{c.t3}}">Recent</h2>
<div style="background: {{c.s1}}; border: 1px solid {{c.line}}; border-radius: 20px; padding: 4px 16px">
<sc-for list="{{docs}}" as="d" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; min-height: 64px; border-bottom: {{d.divider}}">
<span style="width: 40px; height: 48px; flex-shrink: 0; border-radius: 8px; background: {{c.s2}}; color: {{c.t3}}; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800">{{d.type}}</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 700">{{d.name}}</span>
<span style="font-size: 12px; color: {{c.t3}}">{{d.meta}}</span>
</span>
</div>
</sc-for>
</div>
</section>

<p style="margin: 0; font-size: 12px; color: {{c.t3}}; text-align: center">Encrypted on this phone. Screenshots are blocked.</p>
</main>

<nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 10px 8px 20px; display: flex; justify-content: space-around; align-items: flex-start; background: {{c.s1}}; border-top: 1px solid {{c.line}}">
<a href="Main.dc.html" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; font-size: 11px; font-weight: 600; color: {{c.t3}}">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V20H15v-5H9v5H4z"></path></svg>Today</a>
<a href="Accounts.dc.html" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; font-size: 11px; font-weight: 600; color: {{c.t3}}">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"></rect><path d="M3 10h18M16 15h2"></path></svg>Money</a>
<a href="Travel.dc.html" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; font-size: 11px; font-weight: 600; color: {{c.t3}}">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4z"></path><path d="M14 7v10" stroke-dasharray="2 2"></path></svg>Travel</a>
<a href="Notes.dc.html" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; font-size: 11px; font-weight: 600; color: {{c.t3}}">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"></path><path d="M9 12h7M9 16h5"></path></svg>Notes</a>
<a href="More.dc.html" aria-current="page" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; font-size: 11px; font-weight: 700; color: {{c.t1}}">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="2"></rect><rect x="13" y="4" width="7" height="7" rx="2"></rect><rect x="4" y="13" width="7" height="7" rx="2"></rect><rect x="13" y="13" width="7" height="7" rx="2"></rect></svg>More</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":1110}}'>
class Component extends DCLogic {
  pal(t) {
    if (t === 'light') return {bg:'#F3F4F8',s1:'#FFFFFF',s2:'#ECEEF3',line:'#DDE1E9',t1:'#11141B',t2:'#434A58',t3:'#5D6474',vault:'#44536A',vaultT:'#E6EBF2',lend:'#A14A06',lendT:'#FDF0D8',onAccent:'#FFFFFF'};
    return {bg:'#0D0F14',s1:'#161922',s2:'#1F2330',line:'#2B3040',t1:'#F3F5F9',t2:'#B6BCC9',t3:'#8F96A6',vault:'#A3B5CC',vaultT:'rgba(163,181,204,0.14)',lend:'#FBBF24',lendT:'rgba(251,191,36,0.13)',onAccent:'#0D0F14'};
  }
  renderVals() {
    const c = this.pal(this.props.theme);
    const cats = [
      { name: 'Identity', count: '4 documents', color: '#2563EB' },
      { name: 'Finance', count: '6 documents', color: '#047857' },
      { name: 'Insurance', count: '3 documents', color: '#B45309' },
      { name: 'Travel', count: '5 documents', color: '#4F46E5' },
      { name: 'Vehicle', count: '2 documents', color: '#BE185D' },
      { name: 'Medical', count: '3 documents', color: '#0E7490' },
      { name: 'Education', count: '4 documents', color: '#7C3AED' },
      { name: 'New category', count: 'Your own', color: '#475569' }
    ];
    const docs = [
      { name: 'PAN card', meta: 'Identity · added 2 Nov', type: 'PDF' },
      { name: 'Rent agreement 2026', meta: 'Finance · added 28 Oct', type: 'PDF' },
      { name: 'Health insurance card', meta: 'Insurance · photo · 12 Oct', type: 'JPG' }
    ].map((d, i, all) => ({ ...d, divider: i < all.length - 1 ? '1px solid ' + c.line : '0' }));
    return { c, cats, docs };
  }
}
</script>
</body>
</html>
