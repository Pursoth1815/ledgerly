<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Document Vault</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 1110px; position: relative; box-sizing: border-box; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-variant-numeric: tabular-nums; background: {{c.bg}}; color: {{c.t1}}">
<main style="padding: 20px 20px 120px; display: flex; flex-direction: column; gap: 20px">

<header style="display: flex; flex-direction: column; gap: 14px">
<a href="More.dc.html" aria-label="Back to More" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; background: {{c.s2}}; color: {{c.t1}}">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
</a>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.5px; line-height: 40px">Vault</h1>
<p style="margin: 0; font-size: 13px; color: {{c.t2}}">27 documents, encrypted on this phone</p>
</div>
<button style="height: 44px; padding: 0 16px; flex-shrink: 0; border-radius: 22px; border: 0; background: {{c.vault}}; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 6px">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Add</button>
</div>
</header>

<section aria-label="Categories" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{cats}}" as="k" hint-placeholder-count="7">
<button style="height: 76px; box-sizing: border-box; border-radius: 20px; border: 1px solid {{c.line}}; background: {{c.s1}}; color: {{c.t1}}; font-family: inherit; padding: 0 14px; display: flex; align-items: center; gap: 12px; text-align: left">
<span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 13px; background: {{k.color}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<sc-if value="{{k.isId}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><circle cx="9" cy="11" r="2"></circle><path d="M6 16c.7-1.3 1.8-2 3-2s2.3.7 3 2M14.5 10h4M14.5 13.5h3"></path></svg></sc-if>
<sc-if value="{{k.isFin}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h11M7 8.5h11M7 4h3a4.5 4.5 0 0 1 0 9H7l8 7"></path></svg></sc-if>
<sc-if value="{{k.isIns}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"></path><path d="M9 12l2 2 4-4"></path></svg></sc-if>
<sc-if value="{{k.isTra}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.2 13.8L3 11.5l1.6-1.6 7.4.8 4.6-4.6a1.9 1.9 0 0 1 2.7 2.7l-4.6 4.6.8 7.4-1.6 1.6-2.3-7.2-3.3 3.3.3 2.4-1.2 1.2-1.4-3.2-3.2-1.4 1.2-1.2 2.4.3z"></path></svg></sc-if>
<sc-if value="{{k.isVeh}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l1.8-5a2 2 0 0 1 1.9-1.3h6.6a2 2 0 0 1 1.9 1.3L19 13"></path><rect x="3" y="13" width="18" height="5" rx="2"></rect><path d="M6 18v2M18 18v2"></path><circle cx="7.5" cy="15.5" r="0.9"></circle><circle cx="16.5" cy="15.5" r="0.9"></circle></svg></sc-if>
<sc-if value="{{k.isMed}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.6a4.2 4.2 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"></path><path d="M12 10.5v5M9.5 13h5"></path></svg></sc-if>
<sc-if value="{{k.isEdu}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9.5L12 5l10 4.5L12 14z"></path><path d="M6 11.5V16c0 1.4 2.7 3 6 3s6-1.6 6-3v-4.5M22 9.5V15"></path></svg></sc-if>
</span>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-size: 15px; font-weight: 700">{{k.name}}</span>
<span style="font-size: 12px; color: {{c.t3}}">{{k.count}}</span>
</span>
</button>
</sc-for>
<button style="height: 76px; box-sizing: border-box; border-radius: 20px; border: 1.5px dashed {{c.vault}}; background: transparent; color: {{c.vault}}; font-family: inherit; padding: 0 14px; display: flex; align-items: center; gap: 12px; text-align: left">
<span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 13px; background: {{c.vaultT}}; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
</span>
<span style="font-size: 15px; font-weight: 800">New category</span>
</button>
</section>

<section aria-label="Expiring soon" style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 13px; font-weight: 700; color: {{c.t3}}">Expiring soon</h2>
<div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 20px; background: {{c.lendT}}">
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 700">Bike insurance policy</span>
<span style="font-size: 12px; color: {{c.t2}}">Expires 2 Dec · reminder on 18 Nov</span>
</span>
<span style="padding: 4px 10px; border-radius: 999px; background: {{c.lend}}; color: {{c.onAccent}}; font-size: 12px; font-weight: 800">16 days</span>
</div>
</section>

<section aria-label="Recent documents" style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 13px; font-weight: 700; color: {{c.t3}}">Recent</h2>
<div style="background: {{c.s1}}; border: 1px solid {{c.line}}; border-radius: 20px; padding: 4px 16px">
<sc-for list="{{docs}}" as="d" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; min-height: 64px; border-bottom: {{d.divider}}">
<span style="width: 40px; height: 48px; flex-shrink: 0; border-radius: 8px; background: {{d.tint}}; color: {{d.fg}}; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800">{{d.type}}</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 700">{{d.name}}</span>
<span style="font-size: 12px; color: {{c.t3}}">{{d.meta}}</span>
</span>
</div>
</sc-for>
</div>
</section>
</main>

<nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 10px 8px 20px; display: flex; justify-content: space-around; align-items: flex-start; background: {{c.s1}}; border-top: 1px solid {{c.line}}">
<a href="Main.dc.html" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; font-size: 11px; font-weight: 600; color: {{c.t3}}">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V20H15v-5H9v5H4z"></path></svg>Today</a>
<a href="Accounts.dc.html" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; font-size: 11px; font-weight: 600; color: {{c.t3}}">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"></rect><path d="M3 10h18M16 15h2"></path></svg>Money</a>
<a href="Travel.dc.html" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; font-size: 11px; font-weight: 600; color: {{c.t3}}">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4z"></path><path d="M14 7v10" stroke-dasharray="2 2"></path></svg>Travel</a>
<a href="Notes.dc.html" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; font-size: 11px; font-weight: 600; color: {{c.t3}}">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"></path><path d="M9 12h7M9 16h5"></path></svg>Planner</a>
<a href="More.dc.html" aria-current="page" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; font-size: 11px; font-weight: 700; color: {{c.t1}}">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="2"></rect><rect x="13" y="4" width="7" height="7" rx="2"></rect><rect x="4" y="13" width="7" height="7" rx="2"></rect><rect x="13" y="13" width="7" height="7" rx="2"></rect></svg>More</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":1110}}'>
class Component extends DCLogic {
  pal(t) {
    if (t === 'light') return {bg:'#F3F4F8',s1:'#FFFFFF',s2:'#ECEEF3',line:'#DDE1E9',t1:'#11141B',t2:'#434A58',t3:'#5D6474',vault:'#3B5BDB',vaultT:'#E3E9FC',lend:'#A14A06',lendT:'#FDF0D8',onAccent:'#FFFFFF'};
    return {bg:'#0D0F14',s1:'#161922',s2:'#1F2330',line:'#2B3040',t1:'#F3F5F9',t2:'#B6BCC9',t3:'#8F96A6',vault:'#3B5BDB',vaultT:'rgba(124,155,255,0.16)',lend:'#FBBF24',lendT:'rgba(251,191,36,0.13)',onAccent:'#0D0F14'};
  }
  renderVals() {
    const c = this.pal(this.props.theme);
    const defs = [
      { key: 'Id', name: 'Identity', count: '4 documents', color: '#2563EB' },
      { key: 'Fin', name: 'Finance', count: '6 documents', color: '#047857' },
      { key: 'Ins', name: 'Insurance', count: '3 documents', color: '#B45309' },
      { key: 'Tra', name: 'Travel', count: '5 documents', color: '#4F46E5' },
      { key: 'Veh', name: 'Vehicle', count: '2 documents', color: '#BE185D' },
      { key: 'Med', name: 'Medical', count: '3 documents', color: '#0E7490' },
      { key: 'Edu', name: 'Education', count: '4 documents', color: '#7C3AED' }
    ];
    const keys = ['Id', 'Fin', 'Ins', 'Tra', 'Veh', 'Med', 'Edu'];
    const cats = defs.map((d) => {
      const o = { name: d.name, count: d.count, color: d.color };
      keys.forEach((k) => { o['is' + k] = d.key === k; });
      return o;
    });
    const docs = [
      { name: 'PAN card', meta: 'Identity · added 2 Nov', type: 'PDF', tint: 'rgba(37,99,235,0.16)', fg: '#5B8DEF' },
      { name: 'Rent agreement 2026', meta: 'Finance · added 28 Oct', type: 'PDF', tint: 'rgba(4,120,87,0.18)', fg: '#34D399' },
      { name: 'Health insurance card', meta: 'Insurance · photo · 12 Oct', type: 'JPG', tint: 'rgba(180,83,9,0.18)', fg: '#F59E0B' }
    ].map((d, i, all) => ({ ...d, divider: i < all.length - 1 ? '1px solid ' + c.line : '0' }));
    return { c, cats, docs };
  }
}
</script>
</body>
</html>
