<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Accounts and cards wallet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
@keyframes walletDeal{from{opacity:0;transform:translateY(120px) scale(.92)}to{opacity:1}}
@keyframes walletFan{from{opacity:0;transform:translate(-26px,14px) rotate(0deg)}}
@media (prefers-reduced-motion: reduce){.wallet-move{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 880px; position: relative; overflow: hidden; box-sizing: border-box; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-variant-numeric: tabular-nums; background: {{c.scrim}}; color: {{c.t1}}">
<div style="position: absolute; left: 0; right: 0; top: 40px; bottom: 0; border-radius: 28px 28px 0 0; background: {{c.bg}}; overflow: hidden">
<main style="padding: 10px 20px 24px; display: flex; flex-direction: column; gap: 16px">
<span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: {{c.line}}"></span>

<header style="position: relative; height: 124px">
<div class="wallet-move" style="position: absolute; inset: 0; overflow: hidden; box-sizing: border-box; padding: 16px 18px; border-radius: 24px; background: {{c.bannerBg}}; color: {{c.bannerFg}}; display: flex; flex-direction: column; opacity: {{head.listOpacity}}; visibility: {{head.listVisible}}; transform: {{head.listMove}}; transition: opacity 280ms ease {{head.listWait}}, transform 420ms cubic-bezier(.22,.8,.24,1) {{head.listWait}}, visibility 0s linear {{head.listVisibleWait}}">
<h1 style="margin: 0; font-size: 14px; font-weight: 800">Accounts &amp; cards</h1>
<span style="margin-top: 6px; font-size: 34px; font-weight: 800; letter-spacing: -0.8px; line-height: 1.12">₹19,070</span>
<span style="font-size: 13px; font-weight: 700; color: {{c.bannerSub}}">spent in November</span>
<span class="wallet-move" aria-hidden="true" style="position: absolute; right: 46px; top: 26px; width: 74px; height: 48px; border-radius: 9px; background: #CDB8FF; box-shadow: 0 4px 10px rgba(13,15,20,0.14); transform: rotate(-16deg); animation: walletFan 620ms cubic-bezier(.2,.85,.25,1) 120ms backwards"></span>
<span class="wallet-move" aria-hidden="true" style="position: absolute; right: 30px; top: 35px; width: 74px; height: 48px; border-radius: 9px; background: #FFD08F; box-shadow: 0 4px 10px rgba(13,15,20,0.14); transform: rotate(-4deg); animation: walletFan 620ms cubic-bezier(.2,.85,.25,1) 200ms backwards"></span>
<span class="wallet-move" aria-hidden="true" style="position: absolute; right: 14px; top: 48px; width: 74px; height: 48px; border-radius: 9px; background: #A5D8FF; box-shadow: 0 4px 10px rgba(13,15,20,0.16); transform: rotate(9deg); animation: walletFan 620ms cubic-bezier(.2,.85,.25,1) 280ms backwards"><span style="position: absolute; left: 8px; top: 10px; width: 15px; height: 11px; border-radius: 3px; background: #FCD34D"></span></span>
</div>
<div class="wallet-move" style="position: absolute; left: 0; right: 0; top: 0; height: 44px; display: flex; align-items: center; justify-content: space-between; opacity: {{head.navOpacity}}; visibility: {{head.navVisible}}; transform: {{head.navMove}}; transition: opacity 280ms ease {{head.navWait}}, transform 420ms cubic-bezier(.22,.8,.24,1) {{head.navWait}}, visibility 0s linear {{head.navVisibleWait}}">
<button onClick="{{back}}" aria-label="Back to all accounts and cards" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 22px; background: {{c.s2}}; color: {{c.t1}}; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
</button>
<h2 style="margin: 0; font-size: 17px; font-weight: 800">{{head.kindTitle}}</h2>
<span aria-hidden="true" style="width: 44px; flex-shrink: 0"></span>
</div>
</header>

<section aria-label="Your wallet" style="position: relative; height: 570px">
<sc-for list="{{items}}" as="a" hint-placeholder-count="6">
<button class="wallet-move" onClick="{{a.pick}}" aria-expanded="{{a.expanded}}" aria-label="{{a.label}}" disabled="{{a.off}}" style="position: absolute; left: 0; right: 0; top: {{a.top}}; height: 176px; z-index: {{a.z}}; transform: {{a.tf}}; opacity: {{a.opacity}}; visibility: {{a.visible}}; box-sizing: border-box; padding: 12px 16px 14px; border: {{a.border}}; border-radius: 22px; background-color: {{a.bg}}; background-image: {{a.pattern}}; color: {{a.fg}}; box-shadow: 0 -5px 16px rgba(0,0,0,0.3); overflow: hidden; font-family: inherit; text-align: left; display: flex; flex-direction: column; justify-content: space-between; transition: transform {{a.moveMs}} cubic-bezier(.22,.8,.24,1) {{a.wait}}, opacity {{a.fadeMs}} ease {{a.wait}}, visibility 0s linear {{a.visibleWait}}, z-index 0s linear {{a.zWait}}; animation: {{a.deal}}">
<sc-if value="{{a.isCard}}" hint-placeholder-val="{{ true }}">
<svg aria-hidden="true" viewBox="0 0 350 176" preserveAspectRatio="xMidYMid slice" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%">
<circle cx="292" cy="26" r="112" fill="rgba(255,255,255,0.11)"></circle>
<circle cx="352" cy="150" r="104" fill="rgba(0,0,0,0.17)"></circle>
</svg>
</sc-if>
<sc-if value="{{a.isBank}}" hint-placeholder-val="{{ false }}">
<span aria-hidden="true" style="position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,0.42) 1.3px, transparent 1.5px); background-size: 11px 11px; -webkit-mask-image: linear-gradient(105deg, transparent 38%, #000 100%); mask-image: linear-gradient(105deg, transparent 38%, #000 100%)"></span>
</sc-if>
<span style="position: relative; display: flex; align-items: center; gap: 11px">
<sc-if value="{{a.isCard}}" hint-placeholder-val="{{ true }}">
<span aria-hidden="true" style="position: relative; width: 38px; height: 30px; flex-shrink: 0; border-radius: 7px; background: #FCD34D; overflow: hidden">
<span style="position: absolute; left: 0; right: 0; top: 14px; height: 1.5px; background: rgba(120,80,0,0.6)"></span>
<span style="position: absolute; top: 0; bottom: 0; left: 12px; width: 1.5px; background: rgba(120,80,0,0.6)"></span>
<span style="position: absolute; top: 0; bottom: 0; left: 24px; width: 1.5px; background: rgba(120,80,0,0.6)"></span>
</span>
</sc-if>
<sc-if value="{{a.isBank}}" hint-placeholder-val="{{ false }}">
<span aria-hidden="true" style="width: 38px; height: 38px; flex-shrink: 0; border-radius: 19px; background: rgba(255,255,255,0.2); color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 4l9 5.5H3z"></path><path d="M6 10v7M10 10v7M14 10v7M18 10v7M4 20h16"></path></svg>
</span>
</sc-if>
<sc-if value="{{a.isCash}}" hint-placeholder-val="{{ false }}">
<span aria-hidden="true" style="width: 38px; height: 30px; flex-shrink: 0; border-radius: 6px; background: {{c.cash}}; color: {{c.onAccent}}; display: flex; align-items: center; justify-content: center">
<svg width="24" height="16" viewBox="0 0 22 14" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="1" y="1" width="20" height="12" rx="2"></rect><circle cx="11" cy="7" r="2.6"></circle></svg>
</span>
</sc-if>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 17px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{a.nick}}</span>
<span style="font-size: 12px; font-weight: 600; opacity: 0.92; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{a.sub}}</span>
</span>
<span style="flex-shrink: 0; font-size: 17px; font-weight: 800">{{a.spent}}</span>
</span>
<sc-if value="{{a.isCard}}" hint-placeholder-val="{{ true }}">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="position: absolute; right: 18px; top: 92px; opacity: 0.85"><path d="M6 8a6 6 0 0 1 0 8M10.5 5.5a10 10 0 0 1 0 13M15 3a14 14 0 0 1 0 18"></path></svg>
</sc-if>
<span style="position: relative; display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 700">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 14px; letter-spacing: 1px">{{a.digits}}</span>
<span style="padding: 3px 9px; border-radius: 999px; background: {{a.pillBg}}; color: {{a.pillFg}}; font-size: 11px">{{a.pill}}</span>
</span>
</button>
</sc-for>

<sc-for list="{{panels}}" as="o" hint-placeholder-count="1">
<div aria-hidden="{{o.hidden}}" class="wallet-move" style="position: absolute; left: 0; right: 0; top: 110px; z-index: 30; display: flex; flex-direction: column; gap: 12px; visibility: {{o.visible}}; transition: visibility 0s linear {{o.visibleWait}}">

<div class="wallet-move" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px; border-radius: 24px; background: {{o.tint}}; opacity: {{o.opacity}}; transform: {{o.lift}}; transition: opacity {{o.ms}} ease {{o.wait1}}, transform {{o.ms}} cubic-bezier(.22,.8,.24,1) {{o.wait1}}">
<span style="display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 13px; font-weight: 700; color: {{c.t2}}">Spent in November</span>
<span style="font-size: 32px; font-weight: 800; letter-spacing: -0.5px">{{o.spent}}</span>
<span style="font-size: 12px; font-weight: 600; color: {{c.t2}}">{{o.count}} expenses</span>
</span>
<span role="img" aria-label="{{o.share}} of your spending" style="position: relative; width: 84px; height: 84px; flex-shrink: 0">
<svg aria-hidden="true" width="84" height="84" viewBox="0 0 100 100" style="transform: rotate(-90deg)">
<circle cx="50" cy="50" r="42" fill="none" stroke="{{o.track}}" stroke-width="11"></circle>
<circle class="wallet-move" cx="50" cy="50" r="42" fill="none" stroke="{{o.accent}}" stroke-width="11" stroke-linecap="round" style="stroke-dasharray: {{o.dash}} 264; transition: stroke-dasharray {{o.ringMs}} cubic-bezier(.22,.8,.24,1) {{o.ringWait}}"></circle>
</svg>
<span style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
<span style="font-size: 17px; font-weight: 800">{{o.share}}</span>
<span style="font-size: 9px; font-weight: 700; color: {{c.t2}}">of total</span>
</span>
</span>
</div>

<sc-if value="{{o.hasDue}}" hint-placeholder-val="{{ false }}">
<div class="wallet-move" style="display: flex; align-items: center; gap: 14px; padding: 12px 16px 12px 12px; border-radius: 22px; background: {{c.s1}}; opacity: {{o.opacity}}; transform: {{o.lift}}; transition: opacity {{o.ms}} ease {{o.wait2}}, transform {{o.ms}} cubic-bezier(.22,.8,.24,1) {{o.wait2}}">
<span aria-hidden="true" style="width: 50px; height: 54px; flex-shrink: 0; border-radius: 13px; overflow: hidden; display: flex; flex-direction: column; background: {{c.s2}}">
<span style="height: 18px; background: {{o.dueColor}}; color: {{c.onAccent}}; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; letter-spacing: 0.5px">{{o.dueMonth}}</span>
<span style="flex: 1; display: flex; align-items: center; justify-content: center; font-size: 21px; font-weight: 800">{{o.dueDay}}</span>
</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 800">Bill due {{o.due}}</span>
<span style="font-size: 12px; font-weight: 500; color: {{c.t3}}">Every month on the {{o.dueOrdinal}}</span>
</span>
<span style="display: flex; flex-direction: column; align-items: center">
<span style="font-size: 22px; font-weight: 800; line-height: 1.1; color: {{o.dueColor}}">{{o.dueDays}}</span>
<span style="font-size: 11px; font-weight: 700; color: {{c.t3}}">days left</span>
</span>
</div>
</sc-if>

<nav aria-label="{{o.nick}} actions" class="wallet-move" style="display: flex; flex-direction: column; border-radius: 22px; background: {{c.s1}}; overflow: hidden; opacity: {{o.opacity}}; transform: {{o.lift}}; transition: opacity {{o.ms}} ease {{o.wait3}}, transform {{o.ms}} cubic-bezier(.22,.8,.24,1) {{o.wait3}}">
<a href="MoneyAllExpenses.dc.html" style="display: flex; align-items: center; gap: 13px; min-height: 62px; padding: 0 16px 0 12px; color: {{c.t1}}; text-decoration: none">
<span aria-hidden="true" style="width: 38px; height: 38px; flex-shrink: 0; border-radius: 12px; background: {{o.tint}}; color: {{o.accent}}; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z"></path><path d="M9 8h6M9 12h6"></path></svg>
</span>
<span style="flex: 1; font-size: 15px; font-weight: 700">View expenses</span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{c.t3}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
</a>
<sc-if value="{{o.hasDetails}}" hint-placeholder-val="{{ true }}">
<a href="{{o.detailsHref}}" style="display: flex; align-items: center; gap: 13px; min-height: 62px; padding: 0 16px 0 12px; border-top: 1px solid {{c.line}}; color: {{c.t1}}; text-decoration: none">
<span aria-hidden="true" style="width: 38px; height: 38px; flex-shrink: 0; border-radius: 12px; background: {{c.s2}}; color: {{c.t1}}; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M18 7h2M4 17h2M11 17h9"></path><circle cx="15.5" cy="7" r="2.5"></circle><circle cx="8.5" cy="17" r="2.5"></circle></svg>
</span>
<span style="flex: 1; font-size: 15px; font-weight: 700">{{o.detailsLabel}}</span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{c.t3}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</sc-if>
</nav>
</div>
</sc-for>
</section>

<a class="wallet-move" href="AddAccount.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 24px; border: 1.5px dashed {{c.t3}}; color: {{c.t1}}; font-size: 14px; font-weight: 700; text-decoration: none; opacity: {{head.addOpacity}}; visibility: {{head.addVisible}}; transition: opacity 360ms ease {{head.addWait}}, visibility 0s linear {{head.addVisibleWait}}">+ Add account or card</a>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"open":{"editor":"enum","options":["","kiwi","amazon","primary","savings","salary","cash"],"default":""},"$preview":{"width":390,"height":880}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const open = (props && props.open) || null;
    this.state = { open, last: open };
    this.startedOpen = !!open;
  }
  pal(t) {
    if (t === 'light') return {bg:'#F3F4F8',s1:'#FFFFFF',s2:'#ECEEF3',line:'#DDE1E9',t1:'#11141B',t2:'#434A58',t3:'#5D6474',money:'#047857',moneyT:'#E1F4EA',moneyR:'rgba(4,120,87,0.16)',card:'#6D28D9',cardT:'#EFE7FD',cardR:'rgba(109,40,217,0.16)',cash:'#0369A1',cashT:'#E0F2FE',cashR:'rgba(3,105,161,0.16)',cashBg:'#E0F2FE',review:'#B45309',onAccent:'#FFFFFF',scrim:'#9CA3AF',bannerBg:'#E3E6FF',bannerFg:'#1B1F4B',bannerSub:'#4C5190'};
    return {bg:'#0D0F14',s1:'#161922',s2:'#1F2330',line:'#2B3040',t1:'#F3F5F9',t2:'#B6BCC9',t3:'#8F96A6',money:'#34D399',moneyT:'rgba(52,211,153,0.14)',moneyR:'rgba(52,211,153,0.2)',card:'#C4A5FF',cardT:'rgba(196,165,255,0.15)',cardR:'rgba(196,165,255,0.2)',cash:'#38BDF8',cashT:'rgba(56,189,248,0.14)',cashR:'rgba(56,189,248,0.2)',cashBg:'#10303F',review:'#FFB454',onAccent:'#0D0F14',scrim:'#05060A',bannerBg:'#E3E6FF',bannerFg:'#1B1F4B',bannerSub:'#4C5190'};
  }
  renderVals() {
    const c = this.pal(this.props.theme);
    const s = this.state || {};
    const list = [
      { id: 'kiwi', nick: 'Kiwi', bank: 'YES BANK', digits: '•••• 4417', color: '#1D4ED8', spent: '₹11,740', pct: 62, count: 14, kind: 'card', due: '5 Dec', dueMonth: 'DEC', dueDay: 5, dueOrdinal: '5th', dueDays: 20 },
      { id: 'amazon', nick: 'Amazon Pay', bank: 'ICICI Bank', digits: '•••• 7781', color: '#7C2D12', spent: '₹2,500', pct: 13, count: 3, kind: 'card', due: '20 Nov', dueMonth: 'NOV', dueDay: 20, dueOrdinal: '20th', dueDays: 5 },
      { id: 'primary', nick: 'Primary', bank: 'Federal Bank', digits: 'A/C •• 2210', color: '#A16207', spent: '₹2,140', pct: 11, count: 9, kind: 'bank' },
      { id: 'savings', nick: 'Savings', bank: 'HDFC Bank', digits: 'A/C •• 8124', color: '#1E3A8A', spent: '₹1,410', pct: 7, count: 5, kind: 'bank' },
      { id: 'salary', nick: 'Salary', bank: 'ICICI Bank', digits: 'A/C •• 5530', color: '#9A3412', spent: '₹630', pct: 3, count: 2, kind: 'bank' },
      { id: 'cash', nick: 'Cash', bank: 'Paid in cash', digits: '', color: '#0369A1', spent: '₹650', pct: 3, count: 4, kind: 'cash' }
    ];
    const step = 76;
    // The open card sits right under the short top bar.
    const openLift = 80;
    const openIndex = list.findIndex((a) => a.id === s.open);
    const lastIndex = list.findIndex((a) => a.id === s.last);
    const isOpen = openIndex >= 0;
    const items = list.map((a, i) => {
      const on = i === openIndex;
      const wasOn = i === lastIndex;
      const away = Math.abs(i - (isOpen ? openIndex : lastIndex));
      let tf = 'translateY(0) scale(1)';
      let opacity = 1;
      let visible = 'visible';
      let wait = 0;
      let visibleWait = 0;
      let moveMs = 620;
      let fadeMs = 520;
      if (isOpen) {
        if (on) {
          tf = 'translateY(' + (-i * step - openLift) + 'px) scale(1)';
          wait = 40;
        } else {
          tf = 'translateY(190px) scale(0.95)';
          opacity = 0;
          visible = 'hidden';
          wait = away * 35;
          visibleWait = wait + fadeMs;
        }
      } else if (lastIndex >= 0) {
        wait = wasOn ? 170 : 280 + away * 40;
      }
      const isCard = a.kind === 'card';
      const isBank = a.kind === 'bank';
      return {
        ...a,
        isCard,
        isBank,
        isCash: a.kind === 'cash',
        sub: a.due ? a.bank + ' · Due ' + a.due : a.bank,
        initial: a.bank.charAt(0),
        bg: a.kind === 'cash' ? c.cashBg : a.color,
        fg: a.kind === 'cash' ? c.t1 : '#FFFFFF',
        border: a.kind === 'cash' ? '1.5px dashed ' + c.cash : '0',
        pattern: 'none',
        pill: isCard ? 'Credit card' : (isBank ? 'UPI' : 'Cash'),
        pillBg: a.kind === 'cash' ? c.cash : 'rgba(255,255,255,0.22)',
        pillFg: a.kind === 'cash' ? c.onAccent : '#FFFFFF',
        label: a.nick + ', ' + a.spent + ' spent in November' + (a.due ? ', bill due ' + a.due : ''),
        pick: () => { if (!isOpen) this.setState({ open: a.id, last: a.id }); },
        off: isOpen ? 'true' : null,
        expanded: on ? 'true' : 'false',
        top: i * step + 'px',
        z: on ? 20 : i + 1,
        zWait: !isOpen && wasOn ? '820ms' : '0ms',
        tf,
        opacity,
        visible,
        wait: wait + 'ms',
        visibleWait: visibleWait + 'ms',
        moveMs: moveMs + 'ms',
        fadeMs: fadeMs + 'ms',
        deal: this.startedOpen ? 'none' : 'walletDeal 640ms cubic-bezier(.2,.85,.25,1) ' + i * 70 + 'ms backwards'
      };
    });
    const panels = list.map((a, i) => {
      const on = i === openIndex;
      const isCard = a.kind === 'card';
      const tone = isCard ? [c.card, c.cardT, c.cardR] : (a.kind === 'bank' ? [c.money, c.moneyT, c.moneyR] : [c.cash, c.cashT, c.cashR]);
      return {
        ...a,
        share: a.pct + '%',
        hasDue: !!a.due,
        hasDetails: a.kind !== 'cash',
        detailsHref: isCard ? 'AccountDetailsCard.dc.html' : 'AccountDetails.dc.html',
        detailsLabel: isCard ? 'Card details' : 'Account details',
        accent: tone[0],
        tint: tone[1],
        track: tone[2],
        dueColor: a.dueDays <= 7 ? c.review : c.card,
        dash: on ? (a.pct * 2.64).toFixed(1) : '0',
        ringMs: on ? '820ms' : '180ms',
        ringWait: on ? '520ms' : '0ms',
        hidden: on ? 'false' : 'true',
        visible: on ? 'visible' : 'hidden',
        visibleWait: on ? '0ms' : '240ms',
        opacity: on ? 1 : 0,
        lift: on ? 'translateY(0)' : 'translateY(22px)',
        ms: on ? '460ms' : '200ms',
        wait1: on ? '340ms' : '0ms',
        wait2: on ? '420ms' : '0ms',
        wait3: on ? '500ms' : '0ms'
      };
    });
    const head = {
      listOpacity: isOpen ? 0 : 1,
      listVisible: isOpen ? 'hidden' : 'visible',
      listMove: isOpen ? 'translateY(-10px)' : 'translateY(0)',
      listWait: isOpen ? '0ms' : '260ms',
      listVisibleWait: isOpen ? '280ms' : '260ms',
      navOpacity: isOpen ? 1 : 0,
      navVisible: isOpen ? 'visible' : 'hidden',
      navMove: isOpen ? 'translateY(0)' : 'translateY(10px)',
      navWait: isOpen ? '160ms' : '0ms',
      navVisibleWait: isOpen ? '160ms' : '280ms',
      kindTitle: ({ card: 'Credit card', bank: 'Bank account', cash: 'Cash' })[(list[lastIndex] || list[0]).kind],
      addOpacity: isOpen ? 0 : 1,
      addVisible: isOpen ? 'hidden' : 'visible',
      addWait: isOpen ? '0ms' : '520ms',
      addVisibleWait: isOpen ? '360ms' : '520ms'
    };
    return { c, items, panels, head, back: () => this.setState({ open: null }) };
  }
}
</script>
</body>
