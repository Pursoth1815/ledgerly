<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wallet, bank open, light</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
@keyframes walletDeal{from{opacity:0;transform:translateY(120px) scale(.92)}to{opacity:1}}
@keyframes walletRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes walletGrow{from{width:0}}
@media (prefers-reduced-motion: reduce){.wallet-move{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 880px">
<dc-import name="Wallet" theme="light" open="primary" hint-size="390px,880px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":880}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
