name: loopd
description: "Loopd: an offline personal app for money, travel, notes, tasks and documents."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.35.4
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  logging: ^1.3.0
  path: ^1.9.1
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.8
  sqlite3: ^3.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  flutter_lints: ^6.0.0
  pigeon: ^30.0.2
  riverpod_generator: ^4.0.10

# The sqlite3 package bundles its native library through a build hook.
# `sqlcipher` selects its SQLCipher build (ADR 0004). The library is downloaded
# at build time, never at run time.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter:
  uses-material-design: true

  # Bundled fonts (proposal section 18), never downloaded. Pinned releases:
  # Plus Jakarta Sans 2.7.1 (tokotype) and JetBrains Mono 2.304 (JetBrains),
  # both SIL Open Font License 1.1; the licence files ship with them.
  assets:
    - assets/fonts/plus_jakarta_sans/OFL.txt
    - assets/fonts/jetbrains_mono/OFL.txt

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Bold.ttf
          weight: 700
